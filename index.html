function pairRounds(ids,twice=false){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rounds=[];for(let r=0;r<n-1;r++){let round=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)round.push(r%2?[y,x]:[x,y])}rounds.push(round);a.splice(1,0,a.pop())}return twice?rounds.concat(rounds.map(round=>round.map(([a,b])=>[b,a]))):rounds}

function swissFixtures(tid){const t=tour(tid),ids=db.teams.filter(x=>x.tid===tid).map(x=>x.id),maxRounds=Math.max(1,Math.min(12,Number(t?.swissRounds||4))),out=[],seen=new Set(),byeCount=new Map(ids.map(id=>[id,0]));for(let r=1;r<=maxRounds;r++){

function directBracket(tid){const f=formatOf(tour(tid)),ids=db.teams.filter(t=>t.tid===tid).map(t=>t.id);if(f!=='single_elimination'||ids.length<2)return [];let active=ids.slice(),rounds=[];for(let r=0;r<12&&active.length>1;r++){const fixtures=[],next=[];for(let i=0;i<active.length;i+=2){if(!active[i+1]){next.push(active[i]);continue}const a=active[i],b=active[i+1],stage='DIRECT-'+r;fixtures.push({a,b,stage,round:r+1});const m=resultFor(tid,stage,a,b);if(m)next.push(winnerFor(m))}rounds.push(fixtures);if(next.length!==Math.ceil(active.length/2))break;active=next}return rounds}

function knockoutBracket(tid,group){const t=tour(tid);if(formatOf(t)!=='st30'&&formatOf(t)!=='groups_knockout')return [],rows=standings(tid,group),size=(group==='A'?Number(t?.qualifyA||8):group==='B'?Number(t?.qualifyB||4):Number(t?.qualify||8));if(![2,4,8,16,32].includes(size)||rows.length<size)return [];const groupGames=plannedFixtures(tid).filter(x=>x.group===group);if(groupGames.some(x=>!db.matches.some(m=>m.tid===tid&&m.stage==='group'&&((m.a===x.a&&m.b===x.b)||(m.a===x.b&&m.b===x.a)))))return [];let current=rows.slice(0,size).map(x=>x.id),rounds=[];let stageNum=0;while(current.length>1){const stage='KO-'+group+'-'+stageNum,fixtures=[];for(let i=0;i<current.length/2;i++){const a=current[i],b=current[current.length-1-i];fixtures.push({a,b,stage,group,round:stageNum+1});}rounds.push(fixtures);const next=[];for(const f of fixtures){if(!f.a||!f.b)return rounds;const m=db.matches.find(x=>x.tid===tid&&x.stage===stage&&((x.a===f.a&&x.b===f.b)||(x.a===f.b&&x.b===f.a)));if(!m)return rounds;next.push(m.sa>m.sb?m.a:m.b)}current=next;stageNum++}return rounds}

function fixtureList(tid){const games=plannedFixtures(tid);if(!games.length)return '<div class="empty">لا توجد مواجهات دورية لهذا النظام، راجع قرعة خروج المغلوب.</div>';return [...new Set(games.map(x=>x.group))].map(g=>`<h3>المجموعة ${esc(g)} — ${games.filter(x=>x.group===g).length} مباراة مجدولة</h3>${games.filter(x=>x.group===g).map(x=>{const m=db.matches.find(m=>m.tid===tid&&m.stage==='group'&&((m.a===x.a&&m.b===x.b)||(m.a===x.b&&m.b===x.a)));return `<div class="match"><span>${esc(tname(x.a))}</span><span class="score">${m?(m.a===x.a?m.sa+':'+m.sb:m.sb+':'+m.sa):'—'}</span><span>${esc(tname(x.b))}</span><span class="mini">الجولة ${x.round} · ${m?'تم التسجيل':'بانتظار النتيجة'}</span></div>`}).join('')}`).join('')}
function matchList(ms){return ms.length?ms.slice().reverse().map(m=>`<div class="match"><span>${esc(tname(m.a))}</span><span class="score">${m.sa} : ${m.sb}</span><span>${esc(tname(m.b))}</span><span class="mini">${esc(tour(m.tid)?.name||'')} · ${m.stage==='group'?'مجموعات':esc(m.stage||'خروج المغلوب')}</span></div>`).join(''):'<div class="empty">لا توجد نتائج مسجلة.</div>'}function matches(){return `<div class="toolbar"><h2>نتائج المباريات</h2></div>${matchList(db.matches)}`}function rankTable(rows){return `<div class="tablewrap"><table><thead><tr><th>المركز</th><th>اللاعب</th><th>النقاط</th><th>المباريات</th><th>الانتصارات</th><th>الألقاب</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b><div class="mini" dir="ltr" style="text-align:right;overflow-wrap:anywhere">ID: ${esc(shortPlayerId(r.id))}</div></td><td style="color:#6bb3ff"><b>${r.points}</b></td><td>${r.played}</td><td>${r.wins}</td><td>${r.titles}</td></tr>`).join('')}</tbody></table></div>`}function rankings(){return `<div class="toolbar"><h2>تصنيف لاعبي ST</h2><input id="search" placeholder="ابحث عن لاعب..." oninput="filterRank(this.value)"></div><div id="rankResults">${rankTable(ranking())}</div><p class="mini">النقاط تُحسب تلقائيًا من المشاركة، الفوز، والبطل والوصيف حسب إعدادات الإدارة. كسر التعادل: عدد الانتصارات ثم الاسم.</p>`}function filterRank(s){$('rankResults').innerHTML=rankTable(ranking().filter(r=>r.name.includes(s.trim())))}const option=(arr,fn)=>arr.map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('');const field=(label,body)=>`<div class="field"><label>${label}</label>${body}</div>`;function loginView(){return `<div class="card" style="max-width:520px;margin:30px auto"><h2>دخول إدارة ST</h2><p class="muted">المشاهدون يمكنهم متابعة النتائج بدون حساب. الإدارة فقط تتطلب حسابًا مصرحًا به في Supabase.</p><form onsubmit="loginAdmin(event)"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="primary">تسجيل الدخول</button></form><p id="authMsg" class="mini"></p></div>`}

imary">حفظ وإعادة احتساب التصنيف</button></div></form></div>`;return `<div class="card"><h3>النسخ الاحتياطي ونقل البيانات</h3><p class="muted">صدّر نسخة JSON للاحتفاظ بالبيانات أو استوردها على جهاز آخر. الاستيراد يستبدل البيانات الحالية.</p><div class="row"><button class="primary" onclick="exportBackup()">تنزيل نسخة JSON</button><label style="max-width:340px">استيراد ملف JSON<input type="file" accept=".json,application/json" onchange="importBackup(event)"></label><button class="danger" onclick="clearData()">حذف كل البيانات</button></div></div>`}function normalizePlayerName(n){return String(n||'').normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLocaleLowerCase('ar')}function shortPlayerId(id){return "ST-"+String(id||"").replace(/-/g,"").slice(0,10).toUpperCase()}async function copyPlayerId(id){try{await navigator.clipboard.writeText(shortPlayerId(id));alert('تم نسخ Player ID')}catch{prompt('انسخ Player ID:',shortPlayerId(id))}}function addPlayer(e){e.preventDefault();let name=$('pn').value.trim();if(!name)return;if(db.players.some(p=>normalizePlayerName(p.name)===normalizePlayerName(name)))return alert('الاسم مسجل بالفعل؛ استخدم ملف اللاعب الموجود');db.players.push({id:uid(),name});save()}function addTour(e){e.preventDefault();db.tournaments.push({id:uid(),name:$('tn').value.trim(),date:$('td').value,status:$('ts').value,fee:Number($('tfee').value),format:$('tformat').value,swissRounds:Number($('swissRounds').value)});save()}function editTourFormat(id){const t=tour(id);if(!t)return;const values=Object.entries(FORMATS).map(([k,v])=>k+' : '+v).join('\n');const format=prompt('اختر رمز النظام:\n'+values,formatOf(t));if(!format||!FORMATS[format])return;if(db.matches.some(m=>m.tid===id))return alert('لا يمكن تغيير النظام بعد تسجيل النتائج؛ احذف النتائج أولًا');t.format=format;save()}
function addTeam(e){e.preventDefault();const tid=$('teamTour').value,p1=$('p1').value,p2=$('p2').value,group=$('grp').value.trim().toUpperCase();if(p1===p2)return alert('اختار لاعبين مختلفين');if(db.teams.some(t=>t.tid===tid&&t.players.includes(p1)&&t.players.includes(p2)))return alert('الفريق مسجل في البطولة');db.teams.push({id:uid(),tid,group,players:[p1,p2]});save()}function syncTeams(){const ts=db.teams.filter(t=>t.tid===$('mt')?.value);for(const id of ['ma','mb'])if($(id))$(id).innerHTML=option(ts,t=>tname(t.id))}function addMatch(e){e.preventDefault();const tid=$('mt').value,a=$('ma').value,b=$('mb').value,sa=Number($('sa').value),sb=Number($('sb').value),stage=$('stage').value;const ta=team(a),tb=team(b);if(!ta||!tb||a===b||ta.players.some(p=>tb.players.includes(p)))return alert('اختار فريقين مختلفين بدون لاعب مشترك');if(stage==='group'&&['st30','groups_knockout'].includes(formatOf(tour(tid)))&&ta.group!==tb.group)return alert('في دور المجموعات لازم الفريقين يكونوا من نفس المجموعة');if(stage.startsWith('KO-')){const g=stage.split('-')[1],round=Number(stage.split('-')[2]),allowed=knockoutBracket(tid,g)[round]||[];if(!allowed.some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)))return alert('المواجهة غير متاحة في قرعة خروج المغلوب أو لم تكتمل نتائج الدور السابق')}if(stage.startsWith('DIRECT-')){const round=Number(stage.split('-')[1]),allowed=directBracket(tid)[round]||[];if(!allowed.some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)))return alert('المواجهة ليست في القرعة')}if(stage.startsWith('DE-')){const round=Number(stage.split('-')[1]),allowed=doubleBracket(tid)[round]||[];if(!allowed.some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)))return alert('المواجهة ليست في قرعة الفرصتين')}if(stage==='ST-Final'){const winners=['A','B'].map(g=>{const rounds=knockoutBracket(tid,g),last=rounds.at(-1);if(!last||last.length!==1)return null;const f=last[0],m=db.matches.find(x=>x.tid===tid&&x.stage===f.stage&&((x.a===f.a&&x.b===f.b)||(x.a===f.b&&x.b===f.a)));return m?(m.sa>m.sb?m.a:m.b):null});if(!winners.every(Boolean)||!winners.includes(a)||!winners.includes(b))return alert('النهائي متاح فقط بعد تحديد بطل كل مجموعة')}if(stage==='group'&&!plannedFixtures(tid).some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a)))return alert('المواجهة غير موجودة في جدول الجولات الأربع');if(!Number.isInteger(sa)||!Number.isInteger(sb)||sa===sb||sa<0||sb<0||sa>99||sb>99)return alert('نتيجة غير صحيحة، لا يسمح بالتعادل');const pairMatches=db.matches.filter(m=>m.tid===tid&&m.stage===stage&&((m.a===a&&m.b===b)||(m.a===b&&m.b===a)));const scheduled=stage==='group'?plannedFixtures(tid).filter(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a)):[];const available=scheduled.find(x=>!pairMatches.some(m=>m.round===x.round));if(stage==='group'&&!available)return alert('هذه المواجهة غير مجدولة أو تم تسجيل كل مبارياتها');if(stage!=='group'&&pairMatches.length)return alert('المباراة دي مسجلة بالفعل في نفس الدور');db.matches.push({id:uid(),tid,a,b,sa,sb,stage,round:stage==='group'?available.round:undefined});if(stage==='ST-Final'){const tt=tour(tid);tt.champion=sa>sb?a:b;tt.runnerUp=sa>sb?b:a;}save()}function syncChampions(){let ts=db.teams.filter(t=>t.tid===$('ct')?.value);for(const id of ['champ','runner'])if($(id))$(id).innerHTML='<option value="">غير محدد</option>'+option(ts,t=>tname(t.id))}function setChampions(e){e.preventDefault();let t=tour($('ct').value),a=$('champ').value,b=$('runner').value;if(!t)return;if(a&&b&&a===b)return alert('البطل والوصيف لازم مختلفين');t.champion=a||null;t.runnerUp=b||null;save()}function settingsSave(e){e.preventDefault();for(const k of Object.keys(seed.settings))db.settings[k]=Number($('set_'+k).value);save()}function delMatch(id){if(confirm('حذف النتيجة وإعادة احتساب الترتيب؟')){db.matches=db.matches.filter(x=>x.id!==id);save()}}function delPlayer(id){if(db.teams.some(t=>t.players.includes(id)))return alert('احذف فرق اللاعب أولًا');if(confirm('حذف اللاعب؟')){db.players=db.players.filter(x=>x.id!==id);save()}}function delTeam(id){if(db.matches.some(m=>m.a===id||m.b===id)||db.tournaments.some(t=>t.champion===id||t.runnerUp===id))return alert('احذف نتائج الفريق أو اعتماده كبطل/وصيف أولًا');if(confirm('حذف الفريق؟')){db.teams=db.teams.filter(x=>x.id!==id);save()}}function delTour(id){if(db.teams.some(t=>t.tid===id)||db.matches.some(m=>m.tid===id))return alert('احذف الفرق والنتائج المرتبطة بالبطولة أولًا');if(confirm('حذف البطولة؟')){db.tournaments=db.tournaments.filter(x=>x.id!==id);save()}}function exportBackup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='ST-Padel-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importBackup(e){const f=e.target.files?.[0];if(!f)return;f.text().then(s=>{const d=JSON.parse(s);if(!['players','teams','tournaments','matches'].every(k=>Array.isArray(d[k]))||!d.settings||typeof d.settings!=='object')throw Error('invalid');if(!confirm('استبدال كل البيانات الحالية؟'))return;db={...structuredClone(seed),...d};save()}).catch(()=>alert('ملف النسخة الاحتياطية غير صالح'))}function clearData(){if(confirm('تحذير: سيتم حذف كل بيانات ST على هذا المتصفح. هل أنت متأكد؟')){db=structuredClone(seed);save()}}
const IPA='mohandmoahmed14@instapay',IPN_LINK='https://ipn.eg/S/mohandmoahmed14/instapay/9IxfNv';
function registrationPage(){const choices=db.tournaments.filter(t=>t.status!=='منتهية');const selected=choices.find(t=>t.id===selectedTournament)||choices[0];if(!selected)return '<div class="empty">لا توجد بطولة متاحة للتسجيل حاليًا.</div>';selectedTournament=selected.id;return `<h2>تسجيل فريق في بطولة ST</h2><div class="card"><p class="note">يتم التسجيل للفريق بالكامل (لاعبان) بتحويل واحد عبر InstaPay. الطلب لا يُعتمد إلا بعد مراجعة التحويل من الإدارة.</p><form onsubmit="submitRegistration(event)" class="formgrid">${field('البطولة',`<select id="regTour" onchange="selectedTournament=this.value;render()" required>${choices.map(t=>`<option value="${esc(t.id)}" ${t.id===selected.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`)}${field('رسوم الفريق بالكامل',`<input value="${Number(selected.fee||0)} جنيه مصري" disabled>`)}${field('اسم اللاعب الأول','<input id="regP1" required minlength="3" maxlength="80">')}${field('اسم اللاعب الثاني','<input id="regP2" required minlength="3" maxlength="80">')}${field('رقم واتساب للتواصل','<input id="regPhone" type="tel" required minlength="10" maxlength="20" placeholder="01xxxxxxxxx">')}<div class="field wide"><div class="note"><b>حوّل ${Number(selected.fee||0)} جنيه للفريق بالكامل</b><p>عنوان InstaPay: <b>${IPA}</b></p><div class="row"><button type="button" onclick="navigator.clipboard.writeText('${IPA}').then(()=>alert('تم نسخ عنوان الدفع'))">نسخ العنوان</button><a href="${IPN_LINK}" target="_blank" rel="noopener noreferrer" style="color:#a9d5ff">فتح رابط InstaPay ↗</a></div><p class="mini">افتح InstaPay وتأكد من اسم المستفيد والمبلغ قبل التحويل. رفع الإيصال لا يعني تأكيد الدفع.</p></div></div>${field('صورة إيصال التحويل (JPG / PNG / WebP حتى 3 ميجابايت)','<input id="regReceipt" type="file" accept="image/jpeg,image/png,image/webp" required>')}${field('رقم مرجع العملية (اختياري)','<input id="regReference" maxlength="100">')}<div class="field wide"><button class="primary" id="regSubmit">إرسال طلب الاشتراك للمراجعة</button><p id="regMsg" role="status" class="mini"></p></div></form></div><div class="card" style="margin-top:16px"><h3>متابعة حالة طلب سابق</h3><form onsubmit="checkRequest(event)" class="formgrid">${field('رقم الطلب','<input id="trackCode" required placeholder="الصق رقم الطلب هنا">')}<div class="field" style="align-self:end"><button>استعلام</button></div></form><p id="trackMsg" role="status"></p></div>${submittedCode?`<div class="note"><b>رقم طلبك:</b> <span dir="ltr">${esc(submittedCode)}</span><p>احتفظ به لمتابعة حالة الطلب.</p></div>`:''}`}
async function submitRegistration(e){e.preventDefault();if(!cloud)return alert('الاتصال بقاعدة البيانات غير متاح');const t=tour($('regTour').value),p1=$('regP1').value.trim(),p2=$('regP2').value.trim(),phone=$('regPhone').value.trim(),file=$('regReceipt').files?.[0],reference=$('regReference').value.trim(),msg=$('regMsg'),button=$('regSubmit');if(!t||t.status==='منتهية')return alert('البطولة غير متاحة');if(!Number.isInteger(Number(t.fee))||Number(t.fee)<=0)return alert('لم يتم تحديد رسوم اشتراك صحيحة لهذه البطولة. تواصل مع الإدارة');if(normalizePlayerName(p1)===normalizePlayerName(p2))return alert('لا يمكن تسجيل نفس الاسم مرتين في الفريق');if(!/^01[0125][0-9]{8}$/.test(phone))return alert('اكتب رقم موبايل مصري صحيح');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024)return alert('ارفع صورة JPG أو PNG أو WebP بحد أقصى 3 ميجابايت');button.disabled=true;msg.textContent='جار رفع الإيصال وتسجيل الطلب...';const path=crypto.randomUUID()+({ 'image/jpeg':'.jpg','image/png':'.png','image/webp':'.webp'}[file.type]);try{const upload=await cloud.storage.from('st-payment-receipts').upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;const {data,error}=await cloud.rpc('st_submit_registration',{p_tournament_id:t.id,p_player_one:p1,p_player_two:p2,p_phone:phone,p_receipt_path:path,p_reference:reference||null});if(error)throw error;submittedCode=data;msg.textContent='تم إرسال الطلب. احتفظ برقم الطلب الظاهر أدناه.';render();}catch(err){msg.textContent='تعذر إرسال الطلب: '+err.message;}finally{button.disabled=false;}}
async function checkRequest(e){e.preventDefault();const code=$('trackCode').value.trim(),msg=$('trackMsg');msg.textContent='جار الاستعلام...';const {data,error}=await cloud.rpc('st_track_registration',{p_code:code});msg.textContent=error?'حدث خطأ أثناء الاستعلام':!data?'رقم الطلب غير صحيح':data==='pending'?'طلبك قيد مراجعة الدفع':data==='approved'?'تم اعتماد الدفع وتسجيل الفريق رسميًا':'تم رفض الطلب، تواصل مع الإدارة';}
async function loadPaymentRequests(){if(!adminSession||!cloud)return;requestLoading=true;const {data,error}=await cloud.from('st_registrations').select('id,code,tournament_id,tournament_name,player_one,player_two,phone,fee,receipt_path,reference,status,created_at').order('created_at',{ascending:false});requestLoading=false;if(error){console.error(error);return;}paymentRequests=data||[];if(page==='admin'&&adminTab==='payments')render()}
function paymentsAdmin(){const pending=paymentRequests.filter(r=>r.status==='pending').length;return `<div class="toolbar"><h2>طلبات الاشتراك والمدفوعات (${pending} معلّق)</h2><button onclick="loadPaymentRequests()">تحديث الطلبات</button></div><p class="note">راجع وصول المبلغ فعليًا في حساب InstaPay قبل الموافقة. الإيصال وحده لا يثبت الدفع. الموافقة تضيف اللاعبين والفريق إلى البطولة.</p>${requestLoading?'<p>جار تحميل الطلبات...</p>':''}${paymentRequests.length?paymentRequests.map(r=>`<div class="card" style="margin-bottom:12px"><div class="row"><b>${esc(r.player_one)} / ${esc(r.player_two)}</b><span class="pill">${r.status==='pending'?'بانتظار المراجعة':r.status==='approved'?'مقبول':'مرفوض'}</span></div><p>${esc(r.tournament_name)} · <b>${Number(r.fee)} ج.م</b> · ${esc(r.phone)}</p><p class="mini">رقم الطلب: <span dir="ltr">${esc(r.code)}</span> · ${esc(new Date(r.created_at).toLocaleString('ar-EG'))}</p><p class="mini">المرجع: ${esc(r.reference||'غير مذكور')}</p><div class="row"><button onclick="viewReceipt('${r.id}')">عرض الإيصال (خاص بالإدارة)</button>${r.status==='pending'?`<button class="primary" onclick="decideRegistration('${r.id}','approve')">تأكيد الدفع واعتماد الفريق</button><button class="danger" onclick="decideRegistration('${r.id}','reject')">رفض الطلب</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد طلبات بعد.</div>'}`}
async function viewReceipt(id){const r=paymentRequests.find(x=>x.id===id);if(!r)return;const {data,error}=await cloud.storage.from('st-payment-receipts').createSignedUrl(r.receipt_path,90);if(error)return alert('تعذر فتح الإيصال: '+error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function decideRegistration(id,action){const r=paymentRequests.find(x=>x.id===id);if(!r||r.status!=='pending')return;if(!confirm(action==='approve'?`هل تأكدت من وصول ${r.fee} جنيه لحساب InstaPay؟ سيتم اعتماد الفريق رسميًا.`:'رفض الطلب؟'))return;const {error}=await cloud.rpc(action==='approve'?'st_approve_registration':'st_reject_registration',{p_registration_id:id});if(error)return alert('تعذر تنفيذ العملية: '+error.message);await loadCloud();await loadPaymentRequests();alert(action==='approve'?'تم اعتماد الدفع والفريق بنجاح':'تم رفض الطلب')}
function editTeamGroup(id){const t=team(id);if(!t)return;const g=prompt('اكتب المجموعة للفريق (مثال A أو B):',t.group||'');if(g===null)return;const val=g.trim().toUpperCase();if(!/^[A-Z0-9]{1,12}$/.test(val))return alert('اكتب مجموعة صحيحة مثل A أو B');t.group=val;save()}
function editTourFee(id){const t=tour(id);if(!t)return;const n=prompt('رسوم اشتراك الفريق بالكامل (جنيه):',String(t.fee??0));if(n===null)return;const v=Number(n);if(!Number.isSafeInteger(v)||v<0||v>1000000)return alert('أدخل مبلغًا صحيحًا');t.fee=v;save()}

render();initCloud();if(page==='admin'&&adminTab==='results')syncTeams();

function bulkImportTeams(e){e.preventDefault();if(!adminSession)return alert('سجل دخول الإدارة أولًا');const tid=$('bulkTour').value,lines=$('bulkLines').value.trim().split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!tid||!lines.length)return;const errors=[],rows=[],existing=new Set(db.teams.filter(t=>t.tid===tid).map(t=>t.players.slice().sort().join('|')));const playerByName=new Map(db.players.map(p=>[normalizePlayerName(p.name),p.id]));for(let i=0;i<lines.length;i++){const cols=lines[i].split(/[,،;\t]/).map(x=>x.trim());if(cols.length!==3||!cols[0]||!cols[1]||!/^[AB]$/i.test(cols[2])){errors.push('سطر '+(i+1)+': استخدم الاسم، الاسم، A أو B');continue}const names=cols.slice(0,2),keys=names.map(x=>normalizePlayerName(x));if(keys[0]===keys[1]){errors.push('سطر '+(i+1)+': نفس اللاعب مكرر');continue}const ids=keys.map(k=>playerByName.get(k)||'new:'+k),key=ids.slice().sort().join('|');if(existing.has(key)){errors.push('سطر '+(i+1)+': الفريق موجود');continue}existing.add(key);rows.push({names,keys,group:cols[2].toUpperCase()})}if(errors.length)return alert('لم يتم استيراد أي بيانات:\n'+errors.join('\n'));if(!confirm('استيراد '+rows.length+' فريق قديم؟ هذه الطريقة لا تتحقق من دفع InstaPay.'))return;for(const row of rows){const ids=row.keys.map((k,i)=>{let id=playerByName.get(k);if(!id){id=uid();db.players.push({id,name:row.names[i]});playerByName.set(k,id)}return id});db.teams.push({id:uid(),tid,group:row.group,players:ids})}save();alert('تم استيراد '+rows.length+' فريق')}
