function pairRounds(ids,twice=false){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rounds=[];for(let r=0;r<n-1;r++){let round=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)round.push(r%2?[y,x]:[x,y])}rounds.push(round);a.splice(1,0,a.pop())}return twice?rounds.concat(rounds.map(round=>round.map(([a,b])=>[b,a]))):rounds}
function allFixtures(tid){const t=tour(tid),format=formatOf(t),ids=db.teams.filter(x=>x.tid===tid).map(x=>x.id),groups=[...new Set(db.teams.filter(x=>x.tid===tid&&x.group).map(x=>x.group))].sort(),out=[];

if(format==='st30'&&n>=5){let edges=[];for(let i=0;i<n;i++)for(const offset of [1,2])edges.push([members[i],members[(i+offset)%n]]);let rounds=[];for(const [a,b] of edges){let r=rounds.findIndex(x=>!x.has(a)&&!x.has(b));if(r<0){r=rounds.length;rounds.push(new Set())}rounds[r].add(a);rounds[r].add(b);out.push({tid,group:g,round:r+1,a,b})}}

.tournaments.length?'disabled':''}>اعتماد الأبطال</button></div></form><p class="mini">نقاط البطل والوصيف تُضاف مرة واحدة لكل لاعب، وتتحدث تلقائيًا عند تعديل الاعتماد.</p></div>`;if(adminTab==='settings')return `<div class="card"><h3>نقاط تصنيف اللاعبين حسب أعلى دور وصلوا إليه</h3><p class="note">النقاط غير تراكمية داخل البطولة، وتُجمع بين البطولات. الفوز في المجموعات = 3 نقاط لترتيب المجموعة فقط.</p><form class="formgrid" onsubmit="settingsSave(event)">${[['participation','المشاركة في البطولة'],['round16','دخول دور الـ16'],['quarter','دخول دور الـ8'],['semi','دخول نصف النهائي'],['runnerUp','الوصيف'],['champion','البطل']].map(([k,v])=>field(v,`<input type="number" min="0" max="100000" id="set_${k}" value="${Number(db.settings[k]??seed.settings[k])}" required>`)).join('')}<div class="field wide"><button class="primary">حفظ وإعادة احتساب التصنيف</button></div></form></div>`;return `<div class="card"><h3>النسخ الاحتياطي ونقل البيانات</h3><p class="muted">صدّر نسخة JSON للاحتفاظ بالبيانات أو استوردها على جهاز آخر. الاستيراد يستبدل البيانات الحالية.</p><div class="row"><button class="primary" onclick="exportBackup()">تنزيل نسخة JSON</button><label style="max-width:340px">استيراد ملف JSON<input type="file" accept=".json,application/json" onchange="importBackup(event)"></label></div></div>`}
function groupLetters(n){return Array.from({length:n},(_,i)=>String.fromCharCode(65+i))}
function isFair24(t){return formatOf(t)==='groups_knockout'&&['auto_remaining','top2_best4third'].includes(t.qualifyMode)}
function fair24Rank(tid){
 const t=tour(tid);if(!isFair24(t))return {ready:false,reason:'اختار التأهل التلقائي من إعدادات البطولة'};
 const count=Number(t.groupCount)||2,start=Number(t.koStart)||8,base=Number(t.baseQualifiers)||2,letters=groupLetters(count);
 if(![2,4,8,16].includes(start)||base<1||base*count>start)return {ready:false,reason:'عدد المتأهلين الأساسيين أكبر من مقاعد الدور الإقصائي'};
 const members=db.teams.filter(x=>x.tid===tid),expected=Number(t.expectedTeams)||members.length;
 if(members.length!==expected)return {ready:false,reason:'انتظار اعتماد الفرق: '+members.length+' من '+expected};
 if(letters.some(g=>members.filter(x=>x.group===g).length<=base))return {ready:false,reason:'عدد الفرق في إحدى المجموعات لا يكفي للتأهل الأساسي والمنافسة على المقاعد الإضافية'};
 const fixtures=plannedFixtures(tid);
 if(!fixtures.length)return {ready:false,reason:'جدول المجموعات غير مكتمل'};
 for(const f of fixtures){if(!db.matches.some(m=>m.tid===tid&&m.stage==='group'&&m.round===f.round&&((m.a===f.a&&m.b===f.b)||(m.a===f.b&&m.b===f.a))))return {ready:false,reason:'انتظار تسجيل كل نتائج المجموعات ('+fixtures.length+' مباراة)'}}
 const ordered=letters.map(g=>standings(tid,g)),remaining=start-base*count;
 const compare=(a,b)=>b.points-a.points||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf;
 // Choose the best eligible teams at the next unqualified position across groups.
 const extras=[];for(let rank=base;rank<Math.max(...ordered.map(x=>x.length))&&extras.length<remaining;rank++){
  const candidates=ordered.flatMap((rows,i)=>rows[rank]?[{...rows[rank],group:letters[i],position:rank+1}]:[]).sort((a,b)=>compare(a,b)||((t.tieDraw||[]).includes(a.id)&&(t.tieDraw||[]).includes(b.id)?t.tieDraw.indexOf(a.id)-t.tieDraw.indexOf(b.id):0)||a.group.localeCompare(b.group));
  const take=Math.min(remaining-extras.length,candidates.length);
  if(take>0&&take<candidates.length&&compare(candidates[take-1],candidates[take])===0&&!t.tieDraw?.length)return {ready:false,reason:'تعادل مؤثر على آخر مقعد إضافي؛ يلزم حسمه بقرعة فاصلة إداريًا'};
  extras.push(...candidates.slice(0,take));
 }
 if(extras.length!==remaining)return {ready:false,reason:'عدد الفرق غير كافٍ لإكمال مقاعد التأهل'};
 const qualified=ordered.flatMap(rows=>rows.slice(0,base).map(x=>x.id)).concat(extras.map(x=>x.id));
 return {ready:true,qualified,extras,ordered,remaining,base,start,letters};
}
function fair24Bracket(tid){
 const info=fair24Rank(tid);if(!info.ready)return {rounds:[],reason:info.reason};
 const t=tour(tid),start=info.start,groupOf=id=>team(id)?.group;
 const ranked=info.qualified.map(id=>{const g=groupOf(id),r=info.ordered[info.letters.indexOf(g)].findIndex(x=>x.id===id);const x=info.ordered[info.letters.indexOf(g)][r];return {...x,group:g,position:r+1}});
 ranked.sort((a,b)=>a.position-b.position||b.points-a.points||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf||a.group.localeCompare(b.group));
 const high=ranked.slice(0,start/2).map(x=>x.id),low=ranked.slice(start/2).map(x=>x.id);
 const used=new Set(),pairs=[];
 function assign(i){if(i===high.length)return true;const options=low.filter(x=>!used.has(x)&&groupOf(x)!==groupOf(high[i]));for(const x of options){used.add(x);pairs.push([high[i],x]);if(assign(i+1))return true;pairs.pop();used.delete(x)}return false}
 if(!assign(0))return {rounds:[],reason:'تعذر تجنب مواجهات نفس المجموعة في أول دور؛ يلزم تعديل القرعة يدويًا'};
 let active=pairs.flat(),rounds=[];const totalRounds=Math.log2(start);
 for(let r=0;r<totalRounds;r++){
  const stage='GK-'+r,fixtures=[];
  if(r===0){for(const [a,b] of pairs)fixtures.push({a,b,stage,round:1})}
  else {for(let i=0;i<active.length;i+=2)fixtures.push({a:active[i],b:active[i+1],stage,round:r+1})}
  rounds.push(fixtures);const next=[];
  for(const f of fixtures){const m=resultFor(tid,stage,f.a,f.b);if(m)next.push(winnerFor(m))}
  if(next.length!==fixtures.length)break;active=next;
 }
 return {rounds,info};
}
function runTieDraw(tid){
 const t=tour(tid);if(!t||!adminSession||!isFair24(t))return;
 if(db.matches.some(m=>m.tid===tid&&m.stage.startsWith('GK-')))return alert('لا يمكن تغيير القرعة بعد بدء نتائج خروج المغلوب');
 const info=fair24Rank(tid);
 if(info.ready&&!confirm('إعادة إجراء القرعة الفاصلة قد تغيّر المتأهلين. هل تريد الاستمرار؟'))return;
 if(!info.ready&&!info.reason.includes('تعادل مؤثر'))return alert('لا توجد قرعة فاصلة مطلوبة حاليًا: '+info.reason);
 const ids=db.teams.filter(x=>x.tid===tid).map(x=>x.id);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 t.tieDraw=ids;t.tieDrawAt=new Date().toISOString();save();alert('تم إجراء القرعة الفاصلة وحفظها. راجع المتأهلين قبل النشر');
}
function fair24View(tid){const data=fair24Bracket(tid),info=fair24Rank(tid);let html='<h3>التأهل التلقائي: '+Number(tour(tid)?.baseQualifiers||2)+' من كل مجموعة + أفضل الفرق للمقاعد المتبقية</h3>';
 if(!info.ready)return html+`<div class="note">${esc(info.reason)}. لا تُنشأ القرعة قبل اكتمال الشروط.</div>`+(adminSession&&info.reason.includes('تعادل مؤثر')?`<button class="primary" onclick="runTieDraw('${tid}')">إجراء القرعة الفاصلة وحفظها</button>`:'');
 html+=`<p class="note">${info.base} من كل مجموعة (${info.base*info.letters.length} فريق) + ${info.remaining} من أفضل الفرق غير المتأهلة = ${info.start} فريق.</p>`;
 if(adminSession&&tour(tid)?.tieDrawAt)html+=`<p class="mini">تم حسم التعادل بقرعة إدارية محفوظة: ${esc(tour(tid).tieDrawAt)}</p>`; if(info.extras.length)html+='<h3>الفرق المتأهلة بالمقاعد الإضافية</h3><div class="tablewrap"><table><thead><tr><th>المجموعة</th><th>الفريق</th><th>المركز</th><th>النقاط</th><th>الفارق</th></tr></thead><tbody>'+info.extras.map(x=>`<tr><td>${esc(x.group)}</td><td>${esc(tname(x.id))}</td><td>${x.position}</td><td>${x.points}</td><td>${x.gf-x.ga}</td></tr>`).join('')+'</tbody></table></div>';
 for(const [i,round] of data.rounds.entries()){const n=info.start/Math.pow(2,i);html+=`<h3 style="margin-top:18px">${n===2?'النهائي':n===4?'نصف النهائي':n===8?'دور الـ8':'دور الـ16'}</h3>`;for(const f of round){const m=resultFor(tid,f.stage,f.a,f.b);html+=`<div class="match"><span>${esc(tname(f.a))}</span><span class="score">${m?m.sa+' : '+m.sb:'—'}</span><span>${esc(tname(f.b))}</span>${liveTag(tid,f.stage,f.a,f.b,0)}${!m?liveControl(tid,f.stage,f.a,f.b,0):''}</div>`}}
 return html;
}
function groupConfigPanel(t){
 const count=Math.max(2,Math.min(16,Number(t.groupCount)||2)),start=Number(t.koStart)||8;
 const q=t.groupQualifiers||{};

async function viewReceipt(id){const r=paymentRequests.find(x=>x.id===id);if(!r)return;const {data,error}=await cloud.storage.from('st-payment-receipts').createSignedUrl(r.receipt_path,90);if(error)return alert('تعذر فتح الإيصال: '+error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function decideRegistration(id,action){const r=paymentRequests.find(x=>x.id===id);if(!r||r.status!=='pending')return;if(action==='approve'&&!r.phone_two)return alert('لا يمكن اعتماد الطلب: رقم موبايل اللاعب الثاني غير موجود. راجع بيانات التسجيل أولًا.');if(!confirm(action==='approve'?`هل تأكدت من وصول ${r.fee} جنيه لحساب InstaPay؟ سيتم اعتماد الفريق رسميًا.`:'رفض الطلب؟'))return;const {error}=await cloud.rpc(action==='approve'?'st_approve_registration_v2':'st_reject_registration',{p_registration_id:id});if(error)return alert('تعذر تنفيذ العملية: '+error.message);await loadCloud();await loadPaymentRequests();alert(action==='approve'?'تم اعتماد الدفع والفريق بنجاح':'تم رفض الطلب')}
function editTeamGroup(id){const t=team(id);if(!t)return;const g=prompt('اكتب المجموعة للفريق (مثال A أو B):',t.group||'');if(g===null)return;const val=g.trim().toUpperCase();if(!/^[A-Z0-9]{1,12}$/.test(val))return alert('اكتب مجموعة صحيحة مثل A أو B');t.group=val;save()}
function editTourFee(id){const t=tour(id);if(!t)return;const n=prompt('رسوم اشتراك الفريق بالكامل (جنيه):',String(t.fee??0));if(n===null)return;const v=Number(n);if(!Number.isSafeInteger(v)||v<0||v>1000000)return alert('أدخل مبلغًا صحيحًا');t.fee=v;save()}

render();initCloud();if(page==='admin'&&adminTab==='results')syncTeams();

function bulkImportTeams(e){e.preventDefault();if(!adminSession)return alert('سجل دخول الإدارة أولًا');const tid=$('bulkTour').value,lines=$('bulkLines').value.trim().split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!tid||!lines.length)return;const errors=[],rows=[],existing=new Set(db.teams.filter(t=>t.tid===tid).map(t=>t.players.slice().sort().join('|')));const playerByName=new Map(db.players.map(p=>[normalizePlayerName(p.name),p.id]));for(let i=0;i<lines.length;i++){const cols=lines[i].split(/[,،;\t]/).map(x=>x.trim());if(cols.length!==3||!cols[0]||!cols[1]||!/^[AB]$/i.test(cols[2])){errors.push('سطر '+(i+1)+': استخدم الاسم، الاسم، A أو B');continue}const names=cols.slice(0,2),keys=names.map(x=>normalizePlayerName(x));if(keys[0]===keys[1]){errors.push('سطر '+(i+1)+': نفس اللاعب مكرر');continue}const ids=keys.map(k=>playerByName.get(k)||'new:'+k),key=ids.slice().sort().join('|');if(existing.has(key)){errors.push('سطر '+(i+1)+': الفريق موجود');continue}existing.add(key);rows.push({names,keys,group:cols[2].toUpperCase()})}if(errors.length)return alert('لم يتم استيراد أي بيانات:\n'+errors.join('\n'));if(!confirm('استيراد '+rows.length+' فريق قديم؟ هذه الطريقة لا تتحقق من دفع InstaPay.'))return;for(const row of rows){const ids=row.keys.map((k,i)=>{let id=playerByName.get(k);if(!id){id=uid();db.players.push({id,name:row.names[i]});playerByName.set(k,id)}return id});db.teams.push({id:uid(),tid,group:row.group,players:ids})}save();alert('تم استيراد '+rows.length+' فريق')}

/* ST STORE V2: catalog, administration, tracking. Checkout intentionally disabled
   until a trusted receipt-upload endpoint is deployed and verified. */
const stStore={products:[],variants:[],images:[],shipping:[],settings:null,orders:[],ads:[],sponsors:[],loaded:false,loading:false,adminLoaded:{},language:localStorage.getItem('st_store_lang')==='en'?'en':'ar'};
const stT=(ar,en)=>stStore.language==='en'?en:ar;
const stMoney=n=>Number(n||0).toLocaleString(stStore.language==='en'?'en-EG':'ar-EG')+' '+stT('ج.م','EGP');
const stSafeImage=(bucket,path)=>{if(!path||!cloud)return '';return cloud.storage.from(bucket).getPublicUrl(path).data.publicUrl};
function stSetLanguage(v){stStore.language=v;localStorage.setItem('st_store_lang',v);render()}
function stStorePage(){const list=stStore.products.filter(p=>p.is_active);return `<div class="toolbar"><h2>${stT('متجر ST','ST Store')}</h2><select style="width:130px" onchange="stSetLanguage(this.value)"><option value="ar" ${stStore.language==='ar'?'selected':''}>العربية</option><option value="en" ${stStore.language==='en'?'selected':''}>English</option></select></div><div class="note">${stT('المتجر قيد التجهيز. عرض المنتجات متاح، والشراء هيتفعّل بعد اختبار الدفع ورفع الإيصال.','Store is being prepared. Products can be viewed; checkout will be enabled after payment and receipt testing.')}</div>${!stStore.loaded?'<div class="empty">جار تحميل المنتجات...</div>':list.length?`<div class="st-shop-grid">${list.map(p=>{const img=stStore.images.find(x=>x.product_id===p.id),vs=stStore.variants.filter(x=>x.product_id===p.id),price=p.sale_price??p.price;return `<article class="card st-card">${img?`<img class="st-shop-img" src="${esc(stSafeImage('st-store-products',img.image_path))}" alt="${esc(p.name_ar)}" loading="lazy">`:''}<h3>${esc(stStore.language==='en'?(p.name_en||p.name_ar):p.name_ar)}</h3><p class="muted">${esc(stStore.language==='en'?(p.description_en||p.description_ar||''):(p.description_ar||''))}</p><p><b>${stMoney(price)}</b> ${p.sale_price!=null?`<del class="muted">${stMoney(p.price)}</del>`:''}</p><p class="mini">${vs.length?vs.map(v=>`${esc(v.size||'')} ${esc(v.color||'')} (${v.available_quantity})`).join(' · '):stT('لا توجد خيارات متاحة','No variants available')}</p><button disabled>${stT('الشراء قريبًا','Checkout coming soon')}</button></article>`}).join('')}</div>`:'<div class="empty">لا توجد منتجات منشورة حاليًا.</div>'}`}
async function stLoadStore(){if(stStore.loading||stStore.loaded||!cloud)return;stStore.loading=true;try{const [p,i,v]=await Promise.all([cloud.from('st_store_products').select('*').eq('is_active',true).order('created_at',{ascending:false}),cloud.from('st_store_images').select('*').order('sort_order'),cloud.rpc('st_store_available_variants')]);for(const r of [p,i,v])if(r.error)throw r.error;stStore.products=p.data||[];stStore.images=i.data||[];stStore.variants=v.data||[];stStore.loaded=true;}catch(e){console.error(e);stStore.loaded=true;alert('تعذر تحميل المتجر: '+e.message)}finally{stStore.loading=false;if(page==='store')render()}}
function stTrackPage(){return `<div class="card" style="max-width:650px;margin:auto"><h2>متابعة طلب ST Store</h2><p class="muted">أدخل رقم الطلب ورمز المتابعة السري الذي حصلت عليه بعد الطلب.</p><form onsubmit="stTrackOrder(event)" class="stack"><div><label>رقم الطلب</label><input id="stTrackNumber" required maxlength="60" autocomplete="off"></div><div><label>رمز المتابعة السري</label><input id="stTrackToken" required minlength="32" autocomplete="off"></div><button class="primary">متابعة</button></form><div id="stTrackResult"></div></div>`}
async function stTrackOrder(e){e.preventDefault();const el=$('stTrackResult');el.textContent='جار البحث...';const {data,error}=await cloud.rpc('st_store_track_order',{p_order_number:$('stTrackNumber').value.trim(),p_tracking_token:$('stTrackToken').value.trim()});if(error){el.textContent='تعذر البحث: '+error.message;return}const o=data?.[0];el.innerHTML=o?`<div class="note"><p>رقم الطلب: <b>${esc(o.order_number)}</b></p><p>الحالة: ${esc(o.order_status)}</p><p>الدفع: ${esc(o.payment_status)}</p><p>الإجمالي: ${stMoney(o.total_amount)}</p></div>`:'<div class="note">الطلب غير موجود أو رمز المتابعة غير صحيح.</div>'}
async function stLoadAdminTab(tab){if(!adminSession||stStore.adminLoaded[tab]||!cloud)return;stStore.adminLoaded[tab]=true;try{let calls=[];if(tab==='storeproducts')calls=[['products',cloud.from('st_store_products').select('*').order('created_at',{ascending:false})],['variants',cloud.from('st_store_variants').select('*')],['images',cloud.from('st_store_images').select('*').order('sort_order')]];if(tab==='storeorders')calls=[['orders',cloud.from('st_store_orders').select('*').order('created_at',{ascending:false}).limit(100)]];if(tab==='storesettings')calls=[['settings',cloud.from('st_store_settings').select('*').eq('id',1).single()],['shipping',cloud.from('st_store_shipping').select('*').order('id')]];if(tab==='storeads')calls=[['ads',cloud.from('st_ads').select('*').order('sort_order')],['sponsors',cloud.from('st_sponsors').select('*').order('sort_order')]];const results=await Promise.all(calls.map(async ([key,promise])=>[key,await promise]));for(const [key,r] of results){if(r.error)throw r.error;stStore[key]=r.data;}if(page==='admin'&&adminTab===tab)render()}catch(e){stStore.adminLoaded[tab]=false;console.error(e);alert('خطأ تحميل بيانات المتجر: '+e.message)}}
function stAdminProducts(){return `<h3>منتجات ST Store</h3><div class="note">المنتجات الجديدة تبدأ غير منشورة. ارفع الصور بعد حفظ المنتج، وأضف المخزون قبل النشر.</div><div class="card"><form class="formgrid" onsubmit="stAddProduct(event)"><div><label>اسم المنتج بالعربي</label><input id="stPAr" required maxlength="120"></div><div><label>Product name (English)</label><input id="stPEn" maxlength="120"></div><div><label>القسم</label><input id="stPCat" value="general" required></div><div><label>السعر بالجنيه</label><input id="stPPrice" type="number" min="0" step="0.01" required></div><div><label>سعر العرض (اختياري)</label><input id="stPSale" type="number" min="0" step="0.01"></div><div class="field wide"><label>وصف عربي</label><textarea id="stPDesc" style="width:100%" rows="2"></textarea></div><div class="field wide"><label>صور المنتج (اختياري، حتى 5 ميجابايت للصورة)</label><input id="stPImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="mini">يمكنك رفع الصور أثناء إضافة المنتج أو بعد حفظه.</p></div><button class="primary">إضافة المنتج</button></form></div><div class="stack" style="margin-top:15px">${stStore.products.map(p=>`<div class="card"><div class="row"><h3>${esc(p.name_ar)}</h3><span class="pill">${p.is_active?'منشور':'مخفي'}</span></div><p>${stMoney(p.sale_price??p.price)} · ${esc(p.category)}</p><div class="st-form-actions"><button onclick="stToggleProduct('${p.id}',${!p.is_active})">${p.is_active?'إخفاء':'نشر'}</button><button onclick="stAddVariant('${p.id}')">إضافة مقاس/لون ومخزون</button><button onclick="stUploadProductImage('${p.id}')">إضافة صور</button></div><div class="st-product-gallery">${stStore.images.filter(x=>x.product_id===p.id).map((im,i)=>`<div class="st-product-thumb"><img src="${esc(stSafeImage('st-store-products',im.image_path))}" alt="صورة المنتج" loading="lazy"><div class="st-form-actions">${i===0?'<span class="pill">الرئيسية</span>':`<button type="button" onclick="stMakeMainImage('${im.id}','${p.id}')">اجعلها رئيسية</button>`}<button type="button" class="danger" onclick="stDeleteProductImage('${im.id}','${p.id}')">حذف</button></div></div>`).join('')}</div><p class="mini">${stStore.variants.filter(v=>v.product_id===p.id).map(v=>`${esc(v.size||'بدون مقاس')} / ${esc(v.color||'بدون لون')}: ${v.stock_quantity} (${v.reserved_quantity} محجوز)`).join(' · ')||'لم تتم إضافة مخزون'}</p></div>`).join('')||'<div class="empty">جار التحميل أو لا توجد منتجات.</div>'}</div>`}
async function stAddProduct(e){e.preventDefault();const price=Number($('stPPrice').value),sale=$('stPSale').value?Number($('stPSale').value):null;if(sale!==null&&sale>price)return alert('سعر العرض أكبر من السعر الأصلي');const files=Array.from($('stPImages')?.files||[]);const validation=stValidateProductImages(files);if(validation)return alert(validation);const {data,error}=await cloud.from('st_store_products').insert({name_ar:$('stPAr').value.trim(),name_en:$('stPEn').value.trim(),description_ar:$('stPDesc').value.trim(),category:$('stPCat').value.trim(),price,sale_price:sale,is_active:false}).select('id').single();if(error)return alert(error.message);if(files.length){const failed=await stSaveProductImages(data.id,files);if(failed.length)alert('تم حفظ المنتج، لكن تعذر رفع بعض الصور: '+failed.join(' | '));}stRefresh('storeproducts')}
async function stToggleProduct(id,active){if(active&&!stStore.variants.some(v=>v.product_id===id&&v.stock_quantity>v.reserved_quantity))return alert('أضف مخزون متاح قبل النشر');const {error}=await cloud.from('st_store_products').update({is_active:active}).eq('id',id);if(error)return alert(error.message);stRefresh('storeproducts')}
async function stAddVariant(id){const size=prompt('المقاس (اتركه فارغًا لو بدون مقاس)');if(size===null)return;const color=prompt('اللون (اتركه فارغًا لو بدون لون)');if(color===null)return;const q=prompt('كمية المخزون (عدد صحيح)');if(q===null)return;const qty=Number(q);if(!Number.isInteger(qty)||qty<0)return alert('كمية غير صحيحة');const {error}=await cloud.from('st_store_variants').insert({product_id:id,size:size.trim(),color:color.trim(),stock_quantity:qty});if(error)return alert(error.message);stRefresh('storeproducts')}
function stValidateProductImages(files){for(const file of files){if(file.size>5*1024*1024)return 'الحد الأقصى للصورة 5 ميجابايت';if(!['image/jpeg','image/png','image/webp'].includes(file.type))return 'صيغة الصورة غير مدعومة';}return ''}
async function stSaveProductImages(id,files){const failures=[];for(const file of files){const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];const path=id+'/'+crypto.randomUUID()+'.'+ext;const up=await cloud.storage.from('st-store-products').upload(path,file,{contentType:file.type,upsert:false});if(up.error){failures.push(up.error.message);continue;}const existing=stStore.images.filter(x=>x.product_id===id);const r=await cloud.from('st_store_images').insert({product_id:id,image_path:path,sort_order:existing.length+files.indexOf(file)});if(r.error){await cloud.storage.from('st-store-products').remove([path]);failures.push(r.error.message)}}return failures}
async function stUploadProductImage(id){const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='image/jpeg,image/png,image/webp';input.onchange=async()=>{const files=Array.from(input.files||[]);if(!files.length)return;const error=stValidateProductImages(files);if(error)return alert(error);const failures=await stSaveProductImages(id,files);if(failures.length)alert('تعذر رفع بعض الصور: '+failures.join(' | '));stRefresh('storeproducts')};input.click()}
async function stMakeMainImage(imageId,productId){const images=stStore.images.filter(x=>x.product_id===productId);const selected=images.find(x=>x.id===imageId);if(!selected)return;const base=Math.min(0,...images.map(x=>Number(x.sort_order)||0))-1;const {error}=await cloud.from('st_store_images').update({sort_order:base}).eq('id',imageId);if(error)return alert(error.message);stRefresh('storeproducts')}
async function stDeleteProductImage(imageId,productId){const im=stStore.images.find(x=>x.id===imageId&&x.product_id===productId);if(!im||!confirm('حذف صورة المنتج نهائيًا؟'))return;const {error}=await cloud.from('st_store_images').delete().eq('id',imageId);if(error)return alert(error.message);const removed=await cloud.storage.from('st-store-products').remove([im.image_path]);if(removed.error)alert('تم حذف الصورة من المنتج، لكن حذف ملف التخزين فشل: '+removed.error.message);stRefresh('storeproducts')}
function stAdminOrders(){return `<h3>طلبات ST Store</h3><p class="note">الموافقة على الدفع تخصم المخزون المحجوز نهائيًا. راجع الإيصال بنفسك قبل الموافقة.</p><div class="stack">${stStore.orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.order_number)}</b><span class="pill">${esc(o.order_status)} / ${esc(o.payment_status)}</span></div><p>${esc(o.customer_name)} · <span dir="ltr">${esc(o.customer_phone)}</span></p><p>${stMoney(o.total_amount)} · ${esc(o.fulfillment_method)} ${o.shipping_address?' · '+esc(o.shipping_address):''}</p><div class="st-form-actions"><button onclick="stViewReceipt('${o.id}')">عرض الإيصال</button>${o.payment_status==='pending'?`<button class="primary" onclick="stOrderAction('${o.id}','approve')">اعتماد الدفع</button><button class="danger" onclick="stOrderAction('${o.id}','cancel')">رفض / إلغاء</button>`:''}${o.payment_status==='approved'?`<button onclick="stOrderAction('${o.id}','status')">تحديث الحالة</button>`:''}</div></div>`).join('')||'<div class="empty">لا توجد طلبات أو جار التحميل.</div>'}</div>`}
async function stViewReceipt(id){const o=stStore.orders.find(x=>x.id===id);if(!o?.payment_receipt_path)return alert('لا يوجد إيصال');const {data,error}=await cloud.storage.from('st-payment-receipts').createSignedUrl(o.payment_receipt_path,60);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function stOrderAction(id,action){let fn,args;if(action==='approve'){if(!confirm('هل راجعت إيصال InstaPay وتأكدت من وصول المبلغ فعليًا؟'))return;fn='st_store_admin_approve_payment';args={p_order_id:id}}else if(action==='cancel'){const reason=prompt('سبب الإلغاء أو رفض الدفع:');if(reason===null)return;fn='st_store_admin_cancel_order';args={p_order_id:id,p_reason:reason}}else{const status=prompt('الحالة الجديدة: preparing / shipped / delivered');if(!['preparing','shipped','delivered'].includes(status))return alert('حالة غير صحيحة');fn='st_store_admin_set_status';args={p_order_id:id,p_new_status:status}}const {error}=await cloud.rpc(fn,args);if(error)return alert(error.message);stRefresh('storeorders')}
function stAdminSettings(){const s=stStore.settings;return `<h3>إعدادات ST Store</h3>${s?`<div class="card"><form class="formgrid" onsubmit="stSaveSettings(event)"><div><label>اسم مستلم InstaPay</label><input id="stRecipient" value="${esc(s.instapay_recipient_name||'')}"></div><div><label>عنوان InstaPay</label><input id="stInstapay" value="${esc(s.instapay_address||'')}"></div><div><label>عنوان الاستلام بالعربي</label><input id="stPickupAr" value="${esc(s.pickup_address_ar||'')}"></div><div><label>Pickup address (English)</label><input id="stPickupEn" value="${esc(s.pickup_address_en||'')}"></div><div><label><input type="checkbox" id="stPickupEnabled" ${s.pickup_enabled?'checked':''} style="width:auto"> تفعيل الاستلام من المقر</label></div><div><label><input type="checkbox" id="stStoreEnabled" ${s.store_enabled?'checked':''} style="width:auto"> تفعيل المتجر (بعد الاختبارات فقط)</label></div><button class="primary">حفظ الإعدادات</button></form></div>`:'<div class="empty">جار تحميل الإعدادات...</div>'}<h3 style="margin-top:25px">الشحن للمحافظات</h3><div class="stack">${stStore.shipping.map(x=>`<div class="match"><b>${esc(x.governorate_ar)}</b><span>${stMoney(x.shipping_fee)}</span><span>${x.is_enabled?'مفعّل':'غير مفعّل'}</span><button onclick="stEditShipping(${x.id})">تعديل</button></div>`).join('')}</div>`}
async function stSaveSettings(e){e.preventDefault();const enabled=$('stStoreEnabled').checked;if(enabled&&!confirm('تفعيل المتجر الآن لا يفعّل الدفع من الموقع قبل اكتمال خدمة الإيصالات. هل تريد المتابعة؟'))return;const {error}=await cloud.from('st_store_settings').update({instapay_recipient_name:$('stRecipient').value.trim(),instapay_address:$('stInstapay').value.trim(),pickup_address_ar:$('stPickupAr').value.trim(),pickup_address_en:$('stPickupEn').value.trim(),pickup_enabled:$('stPickupEnabled').checked,store_enabled:enabled,updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert(error.message);stRefresh('storesettings')}
async function stEditShipping(id){const x=stStore.shipping.find(x=>x.id===id);if(!x)return;const value=prompt('سعر الشحن إلى '+x.governorate_ar+' بالجنيه',x.shipping_fee);if(value===null)return;const fee=Number(value);if(!Number.isFinite(fee)||fee<0)return alert('سعر غير صحيح');const enabled=confirm('هل تريد تفعيل الشحن لهذه المحافظة؟ إلغاء = تعطيل');const {error}=await cloud.from('st_store_shipping').update({shipping_fee:fee,is_enabled:enabled,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);stRefresh('storesettings')}
function stAdminAds(){return `<h3>الإعلانات والرعاة</h3><p class="note">يمكنك إضافة إعلان أو راعٍ بعد رفع الصورة إلى st-site-media من Storage. استخدم مسار الملف داخل المساحة.</p><div class="card"><form class="formgrid" onsubmit="stAddMedia(event)"><div><label>النوع</label><select id="stMediaType"><option value="ads">إعلان</option><option value="sponsors">راعٍ</option></select></div><div><label>الاسم أو العنوان</label><input id="stMediaTitle" required></div><div><label>مسار الصورة داخل st-site-media</label><input id="stMediaPath" required></div><div><label>رابط خارجي HTTPS (اختياري)</label><input id="stMediaUrl" type="url"></div><button class="primary">إضافة (غير مفعل)</button></form></div><h3 style="margin-top:20px">الإعلانات</h3>${stStore.ads.map(a=>`<div class="match"><b>${esc(a.title_ar)}</b><span>${a.is_active?'مفعّل':'غير مفعّل'}</span><button onclick="stToggleMedia('ads','${a.id}',${!a.is_active})">${a.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'<div class="empty">لا توجد إعلانات.</div>'}<h3>الرعاة</h3>${stStore.sponsors.map(a=>`<div class="match"><b>${esc(a.name)}</b><span>${a.is_active?'مفعّل':'غير مفعّل'}</span><button onclick="stToggleMedia('sponsors','${a.id}',${!a.is_active})">${a.is_active?'تعطيل':'تفعيل'}</button></div>`).join('')||'<div class="empty">لا يوجد رعاة.</div>'}`}
async function stAddMedia(e){e.preventDefault();const ads=$('stMediaType').value==='ads',title=$('stMediaTitle').value.trim(),path=$('stMediaPath').value.trim(),url=$('stMediaUrl').value.trim();const data=ads?{title_ar:title,image_path:path,target_url:url||null,is_active:false}:{name:title,logo_path:path,website_url:url||null,is_active:false};const {error}=await cloud.from(ads?'st_ads':'st_sponsors').insert(data);if(error)return alert(error.message);stRefresh('storeads')}
async function stToggleMedia(type,id,active){const {error}=await cloud.from(type==='ads'?'st_ads':'st_sponsors').update({is_active:active}).eq('id',id);if(error)return alert(error.message);stRefresh('storeads')}
function stRefresh(tab){stStore.adminLoaded[tab]=false;stStore.loaded=false;stLoadAdminTab(tab)}

</script></body></html>
