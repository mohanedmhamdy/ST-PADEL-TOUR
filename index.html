<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071322"><title>ST Padel Tour | بطولات البادل</title><style>
:root{--bg:#071322;--card:#10243a;--card2:#0c1c2e;--line:#27425d;--blue:#278bff;--white:#f7fbff;--muted:#a8bed4;--good:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.7 Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#193450;color:white;border-radius:11px;padding:10px 16px}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);font-weight:bold}button.danger{color:#fecdd3;border-color:#7f1d1d}button:disabled{opacity:.45;cursor:not-allowed}input,select{background:#071827;color:white;border:1px solid #34516e;border-radius:10px;padding:11px;width:100%;min-width:0}input:focus,select:focus{outline:2px solid var(--blue)}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.wrap{max-width:1180px;margin:auto;padding:0 18px}header{position:sticky;top:0;background:#071322f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:4}.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900;white-space:nowrap;letter-spacing:1px}.logo span{color:var(--blue)}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{padding:8px 12px;background:transparent;border:0}nav button.on{background:#163657;color:#70b6ff}.hero{padding:64px 0 35px;background:radial-gradient(ellipse at 15% 0,#134b86 0,transparent 48%)}.kicker{color:#78baff;letter-spacing:3px;font-weight:bold}.hero h1{font-size:clamp(32px,6vw,64px);margin:6px 0;line-height:1.25}.hero p{max-width:650px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:28px 0}.stat,.card{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:20px}.stat strong{display:block;font-size:30px;color:#71b8ff}.stat small,.muted{color:var(--muted)}main{padding:25px 0 75px}h2{font-size:25px;margin:0 0 18px}h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stack{display:grid;gap:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 20px}.toolbar input{max-width:310px}.pill{display:inline-block;background:#123b62;color:#94caff;padding:3px 10px;border-radius:20px;font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.line{height:1px;background:var(--line);margin:15px 0}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:620px;background:var(--card2)}th,td{text-align:right;padding:13px;border-bottom:1px solid var(--line)}th{color:#a8d2ff;background:#15304c}tr:last-child td{border:0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{min-width:0}.field.wide{grid-column:1/-1}.adminnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.adminnav button.on{background:var(--blue)}.note{background:#092b48;border:1px solid #246398;border-radius:12px;padding:12px 15px;color:#b9d9fa;margin:15px 0}.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}.mini{font-size:12px;color:var(--muted)}.match{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:9px}.score{font-weight:900;font-size:20px;color:#82c0ff;white-space:nowrap}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted)}.hide{display:none!important}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.bar{padding:12px 0}.hero{padding:35px 0 15px}nav{overflow-x:auto;max-width:100%}.match{flex-wrap:wrap}.stat strong{font-size:25px}}
</style></head><body><header><div class="wrap bar"><div class="logo">ST <span>PADEL</span> TOUR</div><nav id="nav"></nav></div></header><section class="hero"><div class="wrap"><div class="kicker">ST OFFICIAL TOURNAMENTS</div><h1>كل نقطة بتفرق.<br><span style="color:#4ca1ff">كل بطولة بتتحسب.</span></h1><p>المنصة الرسمية لبطولات ST: الفرق، المجموعات، المباريات، خروج المغلوب وتصنيف اللاعبين.</p><div class="stats" id="stats"></div></div></section><main class="wrap" id="app"></main><footer class="footer"><div class="wrap">© ST Padel Tour · منصة بطولات ST فقط <span style="float:left">النتائج متصلة بقاعدة بيانات ST أونلاين</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const KEY='st_padel_final_v1';const SUPABASE_URL='https://gapbfzfmylotpchrqvwg.supabase.co',SUPABASE_KEY='sb_publishable_v7HcjvAOu63N3HAJxwv4hg_2ZXkAwwa';const cloud=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);let adminSession=null,cloudReady=false;const seed={players:[],teams:[],tournaments:[],matches:[],settings:{win:100,participation:20,champion:250,runnerUp:125},version:1};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)};for(const k of ['players','teams','tournaments','matches'])if(!Array.isArray(db[k]))db[k]=[];db.settings={...seed.settings,...db.settings};let page='home',adminTab='players',selectedTournament='';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(!adminSession){alert('يجب تسجيل الدخول لحفظ التعديلات أونلاين');return;}localStorage.setItem(KEY,JSON.stringify(db));render();cloud.from('site_state').upsert({id:1,data:db,updated_at:new Date().toISOString()}).then(({error})=>{if(error)alert('تعذر حفظ البيانات على Supabase: '+error.message)});}function player(id){return db.players.find(x=>x.id===id)}function team(id){return db.teams.find(x=>x.id===id)}function tname(id){const t=team(id);return t? t.players.map(x=>player(x)?.name||'لاعب محذوف').join(' / '):'فريق غير موجود'}function tour(id){return db.tournaments.find(x=>x.id===id)}function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('ar-EG'):'—'}function ranking(){let pts=new Map(db.players.map(p=>[p.id,{...p,points:0,wins:0,played:0,titles:0}]));let appearances=new Set();for(const m of db.matches){const a=team(m.a),b=team(m.b);if(!a||!b||a.tid!==m.tid||b.tid!==m.tid||m.sa===m.sb)continue;for(const t of [a,b])for(const id of t.players){const r=pts.get(id);if(!r)continue;r.played++;if(!appearances.has(m.tid+'|'+id)){r.points+=+db.settings.participation;appearances.add(m.tid+'|'+id)}}const winner=m.sa>m.sb?a:b;for(const id of winner.players){const r=pts.get(id);if(r){r.wins++;r.points+=+db.settings.win}}}for(const t of db.tournaments){if(t.champion){const a=team(t.champion);for(const id of a?.players||[]){const r=pts.get(id);if(r){r.points+=+db.settings.champion;r.titles++}}}if(t.runnerUp){const a=team(t.runnerUp);for(const id of a?.players||[]){const r=pts.get(id);if(r)r.points+=+db.settings.runnerUp}}}return [...pts.values()].sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name,'ar'))}function standings(tid,group){const ids=db.teams.filter(t=>t.tid===tid&&t.group===group).map(t=>t.id);const r=new Map(ids.map(id=>[id,{id,played:0,w:0,l:0,gf:0,ga:0,points:0}]));for(const m of db.matches.filter(m=>m.tid===tid&&m.stage==='group')){if(!r.has(m.a)||!r.has(m.b))continue;for(const [id,own,opp] of [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]]){let x=r.get(id);x.played++;x.gf+=own;x.ga+=opp;if(own>opp){x.w++;x.points+=3}else x.l++}}return [...r.values()].sort((a,b)=>{let d=b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;if(d)return d;const tied=[...r.values()].filter(x=>x.points===a.points&&x.gf-x.ga===a.gf-a.ga&&x.gf===a.gf);if(tied.length===2){const direct=db.matches.find(m=>m.tid===tid&&m.stage==='group'&&((m.a===a.id&&m.b===b.id)||(m.a===b.id&&m.b===a.id)));if(direct)return (direct.a===a.id?direct.sa>direct.sb:direct.sb>direct.sa)?-1:1}return tname(a.id).localeCompare(tname(b.id),'ar')})}function btns(){const tabs=[['home','الرئيسية'],['tournaments','البطولات'],['matches','النتائج'],['ranking','التصنيف'],['register','تسجيل فريق'],['admin','الإدارة']];$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function stat(n,s){return `<div class="stat"><strong>${n}</strong><small>${s}</small></div>`}function render(){btns();$('stats').innerHTML=stat(db.tournaments.length,'بطولة')+stat(db.players.length,'لاعب')+stat(db.teams.length,'فريق')+stat(db.matches.length,'نتيجة معتمدة');$('app').innerHTML=page==='home'?home():page==='tournaments'?tournaments():page==='matches'?matches():page==='ranking'?rankings():page==='register'?registrationView():adminSession?admin():loginView();if(page==='admin'&&adminSession&&adminTab==='results')syncTeams();if(page==='admin'&&adminSession&&adminTab==='champions')syncChampions();if(page==='admin'&&adminSession&&adminTab==='registrations')loadRegistrations();}function home(){return `<div class="toolbar"><h2>بطولات ST</h2><button class="primary" onclick="go('tournaments')">عرض كل البطولات ←</button></div>${db.tournaments.length?`<div class="grid">${db.tournaments.slice(-3).reverse().map(t=>tourCard(t)).join('')}</div>`:`<div class="empty">لسه مفيش بطولات مسجلة. افتح لوحة الإدارة لإضافة أول بطولة.</div>`}<div class="line"></div><div class="toolbar"><h2>أفضل اللاعبين</h2><button onclick="go('ranking')">التصنيف الكامل</button></div>${ranking().length?rankTable(ranking().slice(0,5)):`<div class="empty">التصنيف هيظهر بعد إضافة اللاعبين والنتائج.</div>`}`}function tourCard(t){const count=db.teams.filter(x=>x.tid===t.id).length;return `<article class="card"><div class="row"><span class="pill">${esc(t.status||'مجدولة')}</span><small class="muted">${fmtDate(t.date)}</small></div><h3 style="margin-top:16px">${esc(t.name)}</h3><p class="muted">${count} فريق · ${db.matches.filter(x=>x.tid===t.id).length} مباراة</p><button onclick="selectedTournament='${t.id}';go('tournaments')">تفاصيل البطولة ←</button></article>`}function tournaments(){let t=tour(selectedTournament);if(!t)return `<div class="toolbar"><h2>بطولات ST</h2></div>${db.tournaments.length?`<div class="grid">${db.tournaments.map(tourCard).join('')}</div>`:'<div class="empty">لم تتم إضافة بطولات بعد.</div>'}`;let groups=[...new Set(db.teams.filter(x=>x.tid===t.id).map(x=>x.group).filter(Boolean))].sort();return `<div class="toolbar"><h2>${esc(t.name)}</h2><button onclick="selectedTournament='';render()">← كل البطولات</button></div><div class="card"><div class="row"><span class="pill">${esc(t.status)}</span><span class="muted">${fmtDate(t.date)}</span></div><p>عدد الفرق: ${db.teams.filter(x=>x.tid===t.id).length} · المباريات: ${db.matches.filter(x=>x.tid===t.id).length}</p>${t.champion?`<p>🏆 البطل: <b>${esc(tname(t.champion))}</b></p>`:''}${t.runnerUp?`<p>🥈 الوصيف: <b>${esc(tname(t.runnerUp))}</b></p>`:''}</div><h2 style="margin-top:30px">ترتيب المجموعات</h2>${groups.length?groups.map(g=>`<h3>المجموعة ${esc(g)}</h3>${standTable(standings(t.id,g))}`).join(''):'<div class="empty">أضف الفرق وحدد مجموعاتها من لوحة الإدارة.</div>'}<h2 style="margin-top:30px">جدول مباريات المجموعات</h2>${fixtureList(t.id)}<h2 style="margin-top:30px">مباريات البطولة</h2>${matchList(db.matches.filter(x=>x.tid===t.id))}`}function standTable(rows){return `<div class="tablewrap"><table><thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فوز</th><th>خسارة</th><th>له</th><th>عليه</th><th>الفارق</th><th>النقاط</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(tname(r.id))}</td><td>${r.played}</td><td>${r.w}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.points}</b></td></tr>`).join('')}</tbody></table></div>`}function fixtureList(tid){const ts=db.teams.filter(t=>t.tid===tid),groups=[...new Set(ts.map(t=>t.group))].sort();if(!groups.length)return '<div class="empty">لا توجد فرق مسجلة.</div>';return groups.map(g=>{const teams=ts.filter(t=>t.group===g),rows=[];for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){const a=teams[i],b=teams[j],m=db.matches.find(m=>m.tid===tid&&m.stage==='group'&&((m.a===a.id&&m.b===b.id)||(m.a===b.id&&m.b===a.id)));rows.push(`<div class="match"><span>${esc(tname(a.id))}</span><span class="score">${m?'✔':'—'}</span><span>${esc(tname(b.id))}</span><span class="mini">${m?'تم التسجيل':'لم تُلعب'}</span></div>`)}return `<h3>المجموعة ${esc(g)} — ${rows.filter(x=>x.includes('تم التسجيل')).length} / ${rows.length} مباراة</h3>${rows.join('')||'<div class="empty">يلزم فريقان على الأقل.</div>'}`}).join('')}function matchList(ms){return ms.length?ms.slice().reverse().map(m=>`<div class="match"><span>${esc(tname(m.a))}</span><span class="score">${m.sa} : ${m.sb}</span><span>${esc(tname(m.b))}</span><span class="mini">${esc(tour(m.tid)?.name||'')} · ${m.stage==='group'?'مجموعات':esc(m.stage||'خروج المغلوب')}</span></div>`).join(''):'<div class="empty">لا توجد نتائج مسجلة.</div>'}function matches(){return `<div class="toolbar"><h2>نتائج المباريات</h2></div>${matchList(db.matches)}`}function rankTable(rows){return `<div class="tablewrap"><table><thead><tr><th>المركز</th><th>اللاعب</th><th>النقاط</th><th>المباريات</th><th>الانتصارات</th><th>الألقاب</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td style="color:#6bb3ff"><b>${r.points}</b></td><td>${r.played}</td><td>${r.wins}</td><td>${r.titles}</td></tr>`).join('')}</tbody></table></div>`}function rankings(){return `<div class="toolbar"><h2>تصنيف لاعبي ST</h2><input id="search" placeholder="ابحث عن لاعب..." oninput="filterRank(this.value)"></div><div id="rankResults">${rankTable(ranking())}</div><p class="mini">النقاط تُحسب تلقائيًا من المشاركة، الفوز، والبطل والوصيف حسب إعدادات الإدارة. كسر التعادل: عدد الانتصارات ثم الاسم.</p>`}function filterRank(s){$('rankResults').innerHTML=rankTable(ranking().filter(r=>r.name.includes(s.trim())))}const option=(arr,fn)=>arr.map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('');const field=(label,body)=>`<div class="field"><label>${label}</label>${body}</div>`;function loginView(){return `<div class="card" style="max-width:520px;margin:30px auto"><h2>دخول إدارة ST</h2><p class="muted">المشاهدون يمكنهم متابعة النتائج بدون حساب. الإدارة فقط تتطلب حسابًا مصرحًا به في Supabase.</p><form onsubmit="loginAdmin(event)"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="primary">تسجيل الدخول</button></form><p id="authMsg" class="mini"></p></div>`}
async function loginAdmin(e){e.preventDefault();const {data,error}=await cloud.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error){$('authMsg').textContent=error.message;return;}const {data:access,error:accessError}=await cloud.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(accessError||!access){await cloud.auth.signOut();$('authMsg').textContent='الحساب غير مصرح له بإدارة ST';return;}adminSession=data.session;await loadCloud();render()}
async function logoutAdmin(){await cloud.auth.signOut();adminSession=null;render()}
async function loadCloud(){if(!cloud)return;const {data,error}=await cloud.from('site_state').select('data').eq('id',1).maybeSingle();if(error){console.error(error);alert('تعذر قراءة قاعدة البيانات: '+error.message);return;}if(data?.data){db={...structuredClone(seed),...data.data};localStorage.setItem(KEY,JSON.stringify(db));}else if(adminSession){const result=await cloud.from('site_state').insert({id:1,data:db});if(result.error)alert('تعذر إنشاء البيانات: '+result.error.message)}cloudReady=true;render()}
async function initCloud(){if(!cloud){alert('تعذر تحميل مكتبة Supabase، تأكد من اتصال الإنترنت');return;}const {data}=await cloud.auth.getSession();if(data.session){const {data:access}=await cloud.from('admin_users').select('user_id').eq('user_id',data.session.user.id).maybeSingle();adminSession=access?data.session:null;}await loadCloud();cloud.channel('st-padel-changes').on('postgres_changes',{event:'*',schema:'public',table:'site_state'},()=>loadCloud()).subscribe();}
function admin(){let tabs=[['players','اللاعبون'],['tournaments','البطولات'],['teams','الفرق'],['registrations','طلبات التسجيل'],['fixtures','الجدول'],['results','النتائج'],['champions','الأبطال'],['settings','النقاط'],['backup','النسخ الاحتياطي']];return `<h2>لوحة إدارة ST <button onclick="logoutAdmin()" style="float:left">تسجيل الخروج</button></h2><div class="note">التعديلات تُحفظ على Supabase، ويجب التأكد من تفعيل صلاحيات الإدارة وقواعد الحماية.</div><div class="adminnav">${tabs.map(([k,v])=>`<button class="${adminTab===k?'on':''}" onclick="adminTab='${k}';render()">${v}</button>`).join('')}</div>${adminContent()}`}function adminContent(){if(adminTab==='registrations')return registrationAdminView();if(adminTab==='players')return `<div class="card"><h3>إضافة لاعب</h3><form onsubmit="addPlayer(event)" class="formgrid">${field('اسم اللاعب','<input id="pn" required maxlength="80" placeholder="الاسم بالكامل">')}<div class="field" style="align-self:end"><button class="primary">إضافة اللاعب</button></div></form></div><h3 style="margin-top:25px">اللاعبون (${db.players.length})</h3>${db.players.length?`<div class="stack">${db.players.map(p=>`<div class="match"><b>${esc(p.name)}</b><button class="danger" onclick="delPlayer('${p.id}')">حذف</button></div>`).join('')}</div>`:'<div class="empty">لا يوجد لاعبون.</div>'}`;if(adminTab==='tournaments')return `<div class="card"><h3>إنشاء بطولة</h3><form onsubmit="addTour(event)" class="formgrid">${field('اسم البطولة','<input id="tn" required maxlength="100">')}${field('التاريخ','<input id="td" type="date" required>')}${field('الحالة','<select id="ts"><option>مجدولة</option><option>جارية</option><option>منتهية</option></select>')}<div class="field" style="align-self:end"><button class="primary">حفظ البطولة</button></div></form></div><h3 style="margin-top:25px">البطولات</h3>${db.tournaments.map(t=>`<div class="match"><b>${esc(t.name)}</b><span>${fmtDate(t.date)}</span><button class="danger" onclick="delTour('${t.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد بطولات.</div>'}`;if(adminTab==='teams')return `<div class="card"><h3>تسجيل فريق زوجي</h3><form class="formgrid" onsubmit="addTeam(event)">${field('البطولة',`<select id="teamTour" required>${option(db.tournaments,t=>t.name)}</select>`)}${field('المجموعة (مثال A أو B)','<input id="grp" required maxlength="12" placeholder="A">')}${field('اللاعب الأول',`<select id="p1" required>${option(db.players,p=>p.name)}</select>`)}${field('اللاعب الثاني',`<select id="p2" required>${option(db.players,p=>p.name)}</select>`)}<div class="field wide"><button class="primary" ${db.players.length<2||!db.tournaments.length?'disabled':''}>إضافة الفريق</button></div></form></div><h3 style="margin-top:25px">الفرق (${db.teams.length})</h3>${db.teams.map(t=>`<div class="match"><b>${esc(tname(t.id))}</b><span class="muted">${esc(tour(t.tid)?.name||'')} · ${esc(t.group)}</span><button class="danger" onclick="delTeam('${t.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد فرق.</div>'}`;if(adminTab==='fixtures')return `<div class="card"><h3>جدول مباريات دور المجموعات</h3><p class="muted">يتم توليد جميع المواجهات داخل كل مجموعة تلقائيًا، مع تمييز المباريات المسجلة. لا يتم إنشاء نتائج افتراضية.</p>${db.tournaments.map(t=>`<h3>${esc(t.name)}</h3>${fixtureList(t.id)}`).join('')||'<div class="empty">أضف بطولة وفرقًا أولًا.</div>'}</div>`;if(adminTab==='results')return `<div class="card"><h3>اعتماد نتيجة مباراة</h3><form class="formgrid" onsubmit="addMatch(event)">${field('البطولة',`<select id="mt" onchange="syncTeams()" required>${option(db.tournaments,t=>t.name)}</select>`)}${field('الدور','<select id="stage"><option value="group">دور المجموعات</option><option value="R16">دور الـ16</option><option value="QF">ربع النهائي</option><option value="SF">نصف النهائي</option><option value="Final">النهائي</option></select>')}${field('الفريق الأول','<select id="ma" required></select>')}${field('الفريق الثاني','<select id="mb" required></select>')}${field('أشواط الفريق الأول','<input type="number" id="sa" min="0" max="99" required>')}${field('أشواط الفريق الثاني','<input type="number" id="sb" min="0" max="99" required>')}<div class="field wide"><button class="primary" ${db.teams.length<2?'disabled':''}>اعتماد النتيجة</button></div></form><p class="mini">النتيجة هنا عدد الأشواط للفريقين في مباراة من مجموعة واحدة؛ لا يُسجّل التعادل. التاي بريك يُحسم لصالح الفائز في النتيجة النهائية.</p></div><h3 style="margin-top:25px">النتائج المسجلة</h3>${db.matches.slice().reverse().map(m=>`<div class="match"><span>${esc(tname(m.a))} <b>${m.sa} : ${m.sb}</b> ${esc(tname(m.b))}</span><button class="danger" onclick="delMatch('${m.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد نتائج.</div>'}`;if(adminTab==='champions')return `<div class="card"><h3>اعتماد بطل ووصيف البطولة</h3><form class="formgrid" onsubmit="setChampions(event)">${field('البطولة',`<select id="ct" onchange="syncChampions()">${option(db.tournaments,t=>t.name)}</select>`)}${field('البطل','<select id="champ"></select>')}${field('الوصيف','<select id="runner"></select>')}<div class="field" style="align-self:end"><button class="primary" ${!db.tournaments.length?'disabled':''}>اعتماد الأبطال</button></div></form><p class="mini">نقاط البطل والوصيف تُضاف مرة واحدة لكل لاعب، وتتحدث تلقائيًا عند تعديل الاعتماد.</p></div>`;if(adminTab==='settings')return `<div class="card"><h3>نظام النقاط</h3><form class="formgrid" onsubmit="settingsSave(event)">${[['win','الفوز في مباراة'],['participation','المشاركة في بطولة'],['champion','بطل البطولة'],['runnerUp','وصيف البطولة']].map(([k,v])=>field(v,`<input type="number" min="0" max="100000" id="set_${k}" value="${+db.settings[k]}" required>`)).join('')}<div class="field wide"><button class="primary">حفظ وإعادة احتساب التصنيف</button></div></form></div>`;return `<div class="card"><h3>النسخ الاحتياطي ونقل البيانات</h3><p class="muted">صدّر نسخة JSON للاحتفاظ بالبيانات أو استوردها على جهاز آخر. الاستيراد يستبدل البيانات الحالية.</p><div class="row"><button class="primary" onclick="exportBackup()">تنزيل نسخة JSON</button><label style="max-width:340px">استيراد ملف JSON<input type="file" accept=".json,application/json" onchange="importBackup(event)"></label><button class="danger" onclick="clearData()">حذف كل البيانات</button></div></div>`}function addPlayer(e){e.preventDefault();let name=$('pn').value.trim();if(!name)return;if(db.players.some(p=>p.name===name))return alert('اللاعب مسجل بالفعل');db.players.push({id:uid(),name});save()}function addTour(e){e.preventDefault();db.tournaments.push({id:uid(),name:$('tn').value.trim(),date:$('td').value,status:$('ts').value});save()}function addTeam(e){e.preventDefault();const tid=$('teamTour').value,p1=$('p1').value,p2=$('p2').value,group=$('grp').value.trim().toUpperCase();if(p1===p2)return alert('اختار لاعبين مختلفين');if(db.teams.some(t=>t.tid===tid&&t.players.includes(p1)&&t.players.includes(p2)))return alert('الفريق مسجل في البطولة');db.teams.push({id:uid(),tid,group,players:[p1,p2]});save()}function syncTeams(){const ts=db.teams.filter(t=>t.tid===$('mt')?.value);for(const id of ['ma','mb'])if($(id))$(id).innerHTML=option(ts,t=>tname(t.id))}function addMatch(e){e.preventDefault();const tid=$('mt').value,a=$('ma').value,b=$('mb').value,sa=Number($('sa').value),sb=Number($('sb').value),stage=$('stage').value;const ta=team(a),tb=team(b);if(!ta||!tb||ta.tid!==tid||tb.tid!==tid||a===b||ta.players.some(p=>tb.players.includes(p)))return alert('اختار فريقين مختلفين بدون لاعب مشترك');if(stage==='group'&&ta.group!==tb.group)return alert('في دور المجموعات لازم الفريقين يكونوا من نفس المجموعة');if(!Number.isInteger(sa)||!Number.isInteger(sb)||sa===sb||sa<0||sb<0||sa>99||sb>99)return alert('نتيجة غير صحيحة، لا يسمح بالتعادل');if(db.matches.some(m=>m.tid===tid&&m.stage===stage&&((m.a===a&&m.b===b)||(m.a===b&&m.b===a))))return alert('المباراة دي مسجلة بالفعل في نفس الدور');db.matches.push({id:uid(),tid,a,b,sa,sb,stage});save()}function syncChampions(){let ts=db.teams.filter(t=>t.tid===$('ct')?.value);for(const id of ['champ','runner'])if($(id))$(id).innerHTML='<option value="">غير محدد</option>'+option(ts,t=>tname(t.id))}function setChampions(e){e.preventDefault();let t=tour($('ct').value),a=$('champ').value,b=$('runner').value;if(!t)return;if(a&&b&&a===b)return alert('البطل والوصيف لازم مختلفين');t.champion=a||null;t.runnerUp=b||null;save()}function settingsSave(e){e.preventDefault();for(const k of Object.keys(seed.settings))db.settings[k]=Number($('set_'+k).value);save()}function delMatch(id){if(confirm('حذف النتيجة وإعادة احتساب الترتيب؟')){db.matches=db.matches.filter(x=>x.id!==id);save()}}function delPlayer(id){if(db.teams.some(t=>t.players.includes(id)))return alert('احذف فرق اللاعب أولًا');if(confirm('حذف اللاعب؟')){db.players=db.players.filter(x=>x.id!==id);save()}}function delTeam(id){if(db.matches.some(m=>m.a===id||m.b===id)||db.tournaments.some(t=>t.champion===id||t.runnerUp===id))return alert('احذف نتائج الفريق أو اعتماده كبطل/وصيف أولًا');if(confirm('حذف الفريق؟')){db.teams=db.teams.filter(x=>x.id!==id);save()}}function delTour(id){if(db.teams.some(t=>t.tid===id)||db.matches.some(m=>m.tid===id))return alert('احذف الفرق والنتائج المرتبطة بالبطولة أولًا');if(confirm('حذف البطولة؟')){db.tournaments=db.tournaments.filter(x=>x.id!==id);save()}}function exportBackup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='ST-Padel-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importBackup(e){const f=e.target.files?.[0];if(!f)return;f.text().then(s=>{const d=JSON.parse(s);if(!['players','teams','tournaments','matches'].every(k=>Array.isArray(d[k]))||!d.settings||typeof d.settings!=='object')throw Error('invalid');if(!confirm('استبدال كل البيانات الحالية؟'))return;db={...structuredClone(seed),...d};save()}).catch(()=>alert('ملف النسخة الاحتياطية غير صالح'))}function clearData(){if(confirm('تحذير: سيتم حذف كل بيانات ST على هذا المتصفح. هل أنت متأكد؟')){db=structuredClone(seed);save()}}render();initCloud();if(page==='admin'&&adminTab==='results')syncTeams();

let registrationRows=[];
function registrationView(){return `<div class="card" style="max-width:760px;margin:auto"><h2>تسجيل فريق في بطولة ST</h2><p class="muted">قدّم طلب تسجيل لفريق من لاعبين. الإدارة هتراجع الطلب قبل إضافته للبطولة.</p><form class="formgrid" onsubmit="submitRegistration(event)">${field('البطولة',`<select id="reg_t" required>${db.tournaments.filter(t=>t.status!=='منتهية').map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select>`)}${field('اسم اللاعب الأول','<input id="reg_p1" maxlength="80" required>')}${field('اسم اللاعب الثاني','<input id="reg_p2" maxlength="80" required>')}${field('رقم التواصل','<input id="reg_phone" type="tel" maxlength="24" required placeholder="01xxxxxxxxx">')}<div class="field wide"><button class="primary" ${!db.tournaments.some(t=>t.status!=='منتهية')?'disabled':''}>إرسال طلب التسجيل</button></div></form><div class="note" id="reg_status">لن يظهر رقم التواصل على الصفحات العامة.</div></div>`}
async function submitRegistration(e){e.preventDefault();if(!cloud)return alert('الاتصال بقاعدة البيانات غير متاح');const tid=$('reg_t')?.value,p1=$('reg_p1').value.trim(),p2=$('reg_p2').value.trim(),phone=$('reg_phone').value.trim();if(!db.tournaments.some(t=>t.id===tid&&t.status!=='منتهية'))return alert('البطولة غير متاحة');if(p1.length<2||p2.length<2||p1.toLowerCase()===p2.toLowerCase()||!/^[0-9+()\s-]{8,24}$/.test(phone))return alert('راجع أسماء اللاعبين ورقم التواصل');const btn=e.target.querySelector('button');btn.disabled=true;try{const {error}=await cloud.from('registrations').insert({tournament_id:tid,player_one:p1,player_two:p2,phone});if(error)throw error;$('reg_status').textContent='تم إرسال طلبك بنجاح، وفي انتظار مراجعة الإدارة.';e.target.reset()}catch(err){alert('تعذر إرسال الطلب: '+err.message)}finally{btn.disabled=false}}
function registrationAdminView(){return `<h3>طلبات تسجيل الفرق (${registrationRows.length})</h3><p class="muted">أرقام التواصل لا تظهر إلا للمسؤول. قبول الطلب يضيف اللاعبين والفريق إلى البطولة.</p><div id="reg_admin_list">جاري تحميل الطلبات...</div>`}
async function loadRegistrations(){if(!adminSession||!cloud)return;const {data,error}=await cloud.from('registrations').select('id,tournament_id,player_one,player_two,phone,status,created_at').order('created_at',{ascending:false}).limit(200);const box=$('reg_admin_list');if(!box)return;if(error){box.textContent='تعذر تحميل الطلبات: '+error.message;return;}registrationRows=data||[];box.innerHTML=registrationRows.length?registrationRows.map(r=>`<div class="match"><div><b>${esc(r.player_one)} / ${esc(r.player_two)}</b><div class="mini">${esc(tour(r.tournament_id)?.name||'بطولة غير موجودة')} · ${esc(r.phone)} · ${esc(r.status)}</div></div><div class="row">${r.status==='pending'?`<button class="primary" onclick="decideRegistration('${r.id}','accepted')">قبول</button><button class="danger" onclick="decideRegistration('${r.id}','rejected')">رفض</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد طلبات تسجيل.</div>'}
async function decideRegistration(id,status){if(!adminSession)return;const r=registrationRows.find(x=>x.id===id);if(!r||r.status!=='pending')return;if(status==='accepted'&&!tour(r.tournament_id))return alert('البطولة غير موجودة');if(!confirm(status==='accepted'?'قبول الفريق وإضافته للبطولة؟':'رفض طلب التسجيل؟'))return;try{if(status==='accepted'){const old=structuredClone(db);const ids=[r.player_one,r.player_two].map(name=>{let p=db.players.find(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase());if(!p){p={id:uid(),name};db.players.push(p)}return p.id});if(db.teams.some(t=>t.tid===r.tournament_id&&ids.every(id=>t.players.includes(id))))return alert('الفريق موجود بالفعل');const group=prompt('المجموعة للفريق (A أو B أو غيرها):','A');if(!group){db=old;return}db.teams.push({id:uid(),tid:r.tournament_id,group:group.trim().toUpperCase(),players:ids});const {error:stateError}=await cloud.from('site_state').upsert({id:1,data:db,updated_at:new Date().toISOString()});if(stateError){db=old;throw stateError}localStorage.setItem(KEY,JSON.stringify(db));}const {error}=await cloud.from('registrations').update({status}).eq('id',id).eq('status','pending');if(error)throw error;render();await loadRegistrations();}catch(e){alert('تعذر تنفيذ القرار: '+e.message)}}
</script></body></html>
