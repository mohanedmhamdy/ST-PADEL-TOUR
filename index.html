:root{--bg:#071322;--card:#10243a;--card2:#0c1c2e;--line:#27425d;--blue:#278bff;--white:#f7fbff;--muted:#a8bed4;--good:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.7 Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#193450;color:white;border-radius:11px;padding:10px 16px}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);font-weight:bold}button.danger{color:#fecdd3;border-color:#7f1d1d}button:disabled{opacity:.45;cursor:not-allowed}input,select{background:#071827;color:white;border:1px solid #34516e;border-radius:10px;padding:11px;width:100%;min-width:0}input:focus,select:focus{outline:2px solid var(--blue)}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.wrap{max-width:1180px;margin:auto;padding:0 18px}header{position:sticky;top:0;background:#071322f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:4}.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900;white-space:nowrap;letter-spacing:1px}.logo span{color:var(--blue)}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{padding:8px 12px;background:transparent;border:0}nav button.on{background:#163657;color:#70b6ff}.hero{padding:64px 0 35px;background:radial-gradient(ellipse at 15% 0,#134b86 0,transparent 48%)}.kicker{color:#78baff;letter-spacing:3px;font-weight:bold}.hero h1{font-size:clamp(32px,6vw,64px);margin:6px 0;line-height:1.25}.hero p{max-width:650px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:28px 0}.stat,.card{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:20px}.stat strong{display:block;font-size:30px;color:#71b8ff}.stat small,.muted{color:var(--muted)}main{padding:25px 0 75px}h2{font-size:25px;margin:0 0 18px}h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stack{display:grid;gap:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 20px}.toolbar input{max-width:310px}.pill{display:inline-block;background:#123b62;color:#94caff;padding:3px 10px;border-radius:20px;font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.line{height:1px;background:var(--line);margin:15px 0}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:620px;background:var(--card2)}th,td{text-align:right;padding:13px;border-bottom:1px solid var(--line)}th{color:#a8d2ff;background:#15304c}tr:last-child td{border:0}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{min-width:0}.field.wide{grid-column:1/-1}.adminnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.adminnav button.on{background:var(--blue)}.note{background:#092b48;border:1px solid #246398;border-radius:12px;padding:12px 15px;color:#b9d9fa;margin:15px 0}.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}.mini{font-size:12px;color:var(--muted)}.match{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:9px}.score{font-weight:900;font-size:20px;color:#82c0ff;white-space:nowrap}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted)}.hide{display:none!important}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.bar{padding:12px 0}.hero{padding:35px 0 15px}nav{overflow-x:auto;max-width:100%}.match{flex-wrap:wrap}.stat strong{font-size:25px}}
 .planbox{margin:15px 0;padding:18px;border:1px solid #315f87;border-radius:15px;background:#0b2136}.plansteps{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.planstep{border:1px solid #35628a;border-radius:12px;padding:12px;min-width:140px;flex:1;background:#102e4b}.planstep b{display:block;color:#9ed0ff}.planstep small{color:#b7c8da}.planlock{padding:20px;text-align:center;border:1px dashed #46769e;border-radius:12px;margin:15px 0}.publish{color:#a9f4d1}.draft{color:#ffd28a} </style></head><body><header><div class="wrap bar"><div class="logo">ST <span>PADEL</span> TOUR</div><nav id="nav"></nav></div></header><section class="hero"><div class="wrap"><div class="kicker">ST OFFICIAL TOURNAMENTS</div><h1>كل نقطة بتفرق.<br><span style="color:#4ca1ff">كل بطولة بتتحسب.</span></h1><p>المنصة الرسمية لبطولات ST: الفرق، المجموعات، المباريات، خروج المغلوب وتصنيف اللاعبين.</p><div class="stats" id="stats"></div></div></section><main class="wrap" id="app"></main><footer class="footer"><div class="wrap">© ST Padel Tour · منصة بطولات ST فقط <span style="float:left">النتائج متصلة بقاعدة بيانات ST أونلاين</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const KEY='st_padel_final_v1';const SUPABASE_URL='https://gapbfzfmylotpchrqvwg.supabase.co',SUPABASE_KEY='sb_publishable_v7HcjvAOu63N3HAJxwv4hg_2ZXkAwwa';const cloud=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);let adminSession=null,cloudReady=false;const seed={players:[],teams:[],tournaments:[],matches:[],settings:{win:100,participation:20,champion:250,runnerUp:125},version:1};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)};for(const k of ['players','teams','tournaments','matches'])if(!Array.isArray(db[k]))db[k]=[];db.settings={...seed.settings,...db.settings};let page='home',adminTab='players',selectedTournament='',paymentRequests=[],requestLoading=false,submittedCode='';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(!adminSession){alert('يجب تسجيل الدخول لحفظ التعديلات أونلاين');return;}cloud.from('site_state').upsert({id:1,data:db,updated_at:new Date().toISOString()}).then(({error})=>{if(error)alert('تعذر حفظ البيانات على Supabase: '+error.message)});}function player(id){return db.players.find(x=>x.id===id)}function team(id){return db.teams.find(x=>x.id===id)}function tname(id){const t=team(id);return t? t.players.map(x=>player(x)?.name||'لاعب محذوف').join(' / '):'فريق غير موجود'}function tour(id){return db.tournaments.find(x=>x.id===id)}function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('ar-EG'):'—'}function ranking(){const result=new Map(db.players.map(p=>[p.id,{...p,points:0,wins:0,played:0,titles:0}]));for(const t of db.tournaments){const teams=db.teams.filter(x=>x.tid===t.id);const ms=db.matches.filter(m=>m.tid===t.id);const scores=new Map(teams.map(x=>[x.id,1]));for(const m of ms){const win=m.sa>m.sb?m.a:m.b;for(const id of [m.a,m.b]){const tm=team(id);for(const pid of tm?.players||[]){const r=result.get(pid);if(r)r.played++}}for(const pid of team(win)?.players||[]){const r=result.get(pid);if(r)r.wins++}if(m.stage!=='group'){const lose=win===m.a?m.b:m.a;let tier=3;if(m.stage==='ST-Final')tier=12;else if(m.stage.startsWith('GK-')){const st=Number(m.stage.split('-')[1]),size=Number(t.koStart||16)/Math.pow(2,st);tier=size===2?12:size===4?8:size===8?5:3;}else if(m.stage.includes('-2'))tier=8;else if(m.stage.includes('-1'))tier=5;scores.set(lose,Math.max(scores.get(lose)||1,tier))}}if(t.runnerUp)scores.set(t.runnerUp,12);if(t.champion)scores.set(t.champion,15);for(const tm of teams)for(const pid of tm.players){const r=result.get(pid);if(r){r.points+=scores.get(tm.id)||1;if(t.champion===tm.id)r.titles++}}}return [...result.values()].sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name,'ar'))}function standings(tid,group){const ids=db.teams.filter(t=>t.tid===tid&&t.group===group).map(t=>t.id);const r=new Map(ids.map(id=>[id,{id,played:0,w:0,l:0,gf:0,ga:0,points:0}]));for(const m of db.matches.filter(m=>m.tid===tid&&m.stage==='group')){if(!r.has(m.a)||!r.has(m.b))continue;for(const [id,own,opp] of [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]]){let x=r.get(id);x.played++;x.gf+=own;x.ga+=opp;if(own>opp){x.w++;x.points+=3}else x.l++}}return [...r.values()].sort((a,b)=>{let d=b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;if(d)return d;const tied=[...r.values()].filter(x=>x.points===a.points&&x.gf-x.ga===a.gf-a.ga&&x.gf===a.gf);if(tied.length===2){const direct=db.matches.find(m=>m.tid===tid&&m.stage==='group'&&((m.a===a.id&&m.b===b.id)||(m.a===b.id&&m.b===a.id)));if(direct)return (direct.a===a.id?direct.sa>direct.sb:direct.sb>direct.sa)?-1:1}return tname(a.id).localeCompare(tname(b.id),'ar')})}function btns(){const tabs=[['home','الرئيسية'],['tournaments','البطولات'],['register','التسجيل'],['matches','النتائج'],['ranking','التصنيف'],['admin','الإدارة']];$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function stat(n,s){return `<div class="stat"><strong>${n}</strong><small>${s}</small></div>`}function render(){btns();$('stats').innerHTML=stat(db.tournaments.length,'بطولة')+stat(db.players.length,'لاعب')+stat(db.teams.length,'فريق')+stat(db.matches.length,'نتيجة معتمدة');$('app').innerHTML=page==='home'?home():page==='register'?registrationPage():page==='tournaments'?tournaments():page==='matches'?matches():page==='ranking'?rankings():adminSession?admin():loginView();if(page==='admin'&&adminSession&&adminTab==='results')syncTeams();if(page==='admin'&&adminSession&&adminTab==='champions')syncChampions();}function home(){return `<div class="toolbar"><h2>بطولات ST</h2><button class="primary" onclick="go('tournaments')">عرض كل البطولات ←</button></div>${db.tournaments.length?`<div class="grid">${db.tournaments.slice(-3).reverse().map(t=>tourCard(t)).join('')}</div>`:`<div class="empty">لسه مفيش بطولات مسجلة. افتح لوحة الإدارة لإضافة أول بطولة.</div>`}<div class="line"></div><div class="toolbar"><h2>أفضل اللاعبين</h2><button onclick="go('ranking')">التصنيف الكامل</button></div>${ranking().length?rankTable(ranking().slice(0,5)):`<div class="empty">التصنيف هيظهر بعد إضافة اللاعبين والنتائج.</div>`}`}function tourCard(t){const count=db.teams.filter(x=>x.tid===t.id).length;return `<article class="card"><div class="row"><span class="pill">${esc(t.status||'مجدولة')}</span><small class="muted">${fmtDate(t.date)}</small></div><h3 style="margin-top:16px">${esc(t.name)}</h3><p class="muted">${count} فريق · ${db.matches.filter(x=>x.tid===t.id).length} مباراة</p><button onclick="selectedTournament='${t.id}';go('tournaments')">تفاصيل البطولة ←</button> <button class="primary" onclick="selectedTournament='${t.id}';go('register')">اشترك الآن</button></article>`}function tournaments(){let t=tour(selectedTournament);if(!t)return `<div class="toolbar"><h2>بطولات ST</h2></div>${db.tournaments.length?`<div class="grid">${db.tournaments.map(tourCard).join('')}</div>`:'<div class="empty">لم تتم إضافة بطولات بعد.</div>'}`;let groups=[...new Set(db.teams.filter(x=>x.tid===t.id).map(x=>x.group).filter(Boolean))].sort();const f=formatOf(t);return `<div class="toolbar"><h2>${esc(t.name)}</h2><button onclick="selectedTournament='';render()">← كل البطولات</button></div><div class="card"><div class="row"><span class="pill">${esc(t.status)}</span><span class="muted">${fmtDate(t.date)}</span></div><p>نظام البطولة: <b>${esc(FORMATS[f]||FORMATS.st30)}</b></p><p>عدد الفرق: ${db.teams.filter(x=>x.tid===t.id).length} · المباريات: ${db.matches.filter(x=>x.tid===t.id).length}</p>${t.champion?`<p>🏆 البطل: <b>${esc(tname(t.champion))}</b></p>`:''}${t.runnerUp?`<p>🥈 الوصيف: <b>${esc(tname(t.runnerUp))}</b></p>`:''}</div><p><button class="primary" onclick="selectedTournament='${t.id}';go('register')">سجل فريقك في البطولة</button></p>${publicDraw(t)?`<div class="note">${drawPublished(t)?'القرعة منشورة للجمهور':'معاينة إدارية — القرعة غير منشورة'}</div>${formatPlan(t)}<h2 style="margin-top:30px">ترتيب المجموعات</h2>${['round_robin','league','swiss'].includes(f)?standTable(leagueStandings(t.id)):groups.length?groups.map(g=>`<h3>المجموعة ${esc(g)}</h3>${standTable(standings(t.id,g))}`).join(''):'<div class="empty">أضف الفرق وحدد مجموعاتها من لوحة الإدارة.</div>'}<h2 style="margin-top:30px">جدول مباريات المجموعات</h2>${fixtureList(t.id)}<h2 style="margin-top:30px">خروج المغلوب</h2>${knockoutView(t.id)}<h2 style="margin-top:30px">مباريات البطولة</h2>${matchList(db.matches.filter(x=>x.tid===t.id))}`:`<div class="planlock"><h3>🔒 القرعة لم تُنشر بعد</h3><p class="muted">تفاصيل المواجهات وجدول المباريات ستظهر بعد اعتماد الإدارة ونشر القرعة.</p></div>`}` }function standTable(rows){return `<div class="tablewrap"><table><thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فوز</th><th>خسارة</th><th>له</th><th>عليه</th><th>الفارق</th><th>النقاط</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(tname(r.id))}</td><td>${r.played}</td><td>${r.w}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.points}</b></td></tr>`).join('')}</tbody></table></div>`}const FORMATS={st30:'ST 30 — مجموعتان ونهائي',round_robin:'دوري كامل — كل فريق ضد الجميع',single_elimination:'خروج مغلوب مباشر',groups_knockout:'مجموعات ثم خروج مغلوب',double_elimination:'خروج مغلوب بفرصتين (مسار فائزين وخاسرين)',swiss:'النظام السويسري — جولات متتالية',league:'دوري ذهاب وإياب'};

 function bracketSize(n){let k=2;while(k<Math.max(2,n))k*=2;return k}
function formatPlan(t,previewCount){
const f=formatOf(t),n=Number(previewCount)||db.teams.filter(x=>x.tid===t?.id).length||0;
let steps=[],notes=[],expected='';
const add=(name,desc)=>steps.push({name,desc});
if(f==='st30'){
add('المجموعة A','يتم توزيع فرق المجموعة A وتحديد مواجهات دور المجموعات. عندما تضم المجموعة 15 فريقًا، يلعب كل فريق 4 مباريات؛ الفوز يمنح 3 نقاط في ترتيب المجموعة، ويُرتب الفرق حسب النقاط ثم فارق الأشواط ثم الأشواط المسجلة ثم المواجهة المباشرة عند انطباقها.');
add('المجموعة B','تلعب فرق المجموعة B مواجهاتها بشكل مستقل عن المجموعة A، ويُحسب ترتيبها بالطريقة نفسها. لا تواجه فرق A فرق B في هذه المرحلة.');
add('تحديد المتأهلين','بعد اكتمال نتائج المجموعات، يتأهل أفضل '+Number(t?.qualifyA||8)+' فرق من A وأفضل '+Number(t?.qualifyB||4)+' فرق من B إلى تصفيات منفصلة. عند التعادل الكامل الذي لا تحسمه معايير الترتيب، تُجرى قرعة فاصلة إداريًا.');
add('خروج المغلوب داخل كل مجموعة','تلعب الفرق المتأهلة مواجهات إقصائية داخل مجموعتها. الفائز ينتقل للدور التالي والخاسر يودّع التصفيات، حتى يتحدد بطل واحد من A وبطل واحد من B.');
add('النهائي العام','يلعب بطل المجموعة A ضد بطل المجموعة B مباراة نهائية واحدة لتحديد بطل ST والوصيف. تُحتسب نقاط التصنيف لكل لاعب بحسب أعلى مرحلة حققها في البطولة.');
notes.push('نظام ST 30 يفترض مجموعتين، ويُفضّل استخدام 15 فريقًا في كل مجموعة لتحقيق 4 مباريات لكل فريق.');
}else if(f==='groups_knockout'){
add('توزيع الفرق على المجموعات','تحدد الإدارة عدد المجموعات وتوزيع الفرق عليها قبل اعتماد القرعة. عدد المباريات داخل كل مجموعة يعتمد على عدد فرقها؛ كل فريق يواجه باقي فرق مجموعته وفق الجدول المتاح.');
add('دور المجموعات','تُسجل نتائج كل مباراة بالأشواط، ويحصل الفائز على 3 نقاط والخاسر على صفر. يتحدد ترتيب الفرق بالنقاط ثم فارق الأشواط ثم الأشواط المسجلة ثم المواجهة المباشرة إن انطبقت.');
add('تحديد الفرق المتأهلة','بعد انتهاء مباريات المجموعة تُختار الفرق المتأهلة حسب العدد المحدد لها. لا تبدأ مباريات خروج المغلوب قبل اكتمال النتائج اللازمة لتحديد الفرق المتأهلة.');
add('الأدوار الإقصائية','يتواجه المتأهلون في مباريات خروج مغلوب: الفائز يكمل والخاسر يخرج، حتى يتحدد الفائز في المسار. عدد الأدوار يتوقف على عدد المتأهلين.');
add('تحديد البطل',isFair24(t)?'يتأهل العدد الأساسي من كل مجموعة ثم تُملأ المقاعد المتبقية تلقائيًا بأفضل الفرق حسب الترتيب.':'تتحدد طريقة التأهل من إعدادات البطولة.');
notes.push(isFair24(t)?'تُحسب المقاعد الإضافية بالنقاط ثم فارق الأشواط ثم الأشواط المسجلة، ويجب حسم التعادل المؤثر إداريًا.':'اختر إعدادات التأهل من لوحة الإدارة؛ نظام التأهل التلقائي يدعم أعدادًا مختلفة من الفرق والمجموعات.');
}else if(f==='single_elimination'){
const size=bracketSize(n||2);
for(let k=size;k>=2;k/=2){
const matches=k/2,qualifiers=k/2,first=k===size;
const label=k===2?'النهائي':k===4?'نصف النهائي':k===8?'ربع النهائي':'دور الـ'+k;
let desc='تُقام '+matches+' '+(matches===1?'مباراة':matches===2?'مباراتان':'مباريات')+' في هذا الدور عند اكتمال جميع مقاعده. الفائز في كل مواجهة يتأهل إلى '+(k===2?'لقب البطولة':k===4?'النهائي':k===8?'نصف النهائي':k===16?'ربع النهائي':'دور الـ'+(k/2))+'، والخاسر يخرج من البطولة.';
if(first&&n&&size>n)desc+=' عدد الفرق '+n+'، ولذلك توجد '+(size-n)+' خانة إعفاء (Bye) في بداية المسار، وقد يتأهل أصحاب الإعفاء دون لعب مباراة في الدور الأول.';
add(label,desc);
}
expected=n>=2?(n-1)+' مباراة لتحديد البطل عند اكتمال البطولة':'';
notes.push('القرعة الفعلية تتحدد بعد إضافة الفرق. المعاينة توضح هيكل الأدوار ولا تعني اعتماد المواجهات أو نشرها.');

function groupLetters(n){return Array.from({length:n},(_,i)=>String.fromCharCode(65+i))}
function isFair24(t){return formatOf(t)==='groups_knockout'&&['auto_remaining','top2_best4third'].includes(t.qualifyMode)}
function fair24Rank(tid){
 const t=tour(tid);if(!isFair24(t))return {ready:false,reason:'اختار التأهل التلقائي من إعدادات البطولة'};
 const count=Number(t.groupCount)||2,start=Number(t.koStart)||8,base=Number(t.baseQualifiers)||2,letters=groupLetters(count);
 if(![2,4,8,16].includes(start)||base<1||base*count>start)return {ready:false,reason:'عدد المتأهلين الأساسيين أكبر من مقاعد الدور الإقصائي'};
 const members=db.teams.filter(x=>x.tid===tid),expected=Number(t.expectedTeams)||members.length;
 if(members.length!==expected)return {ready:false,reason:'انتظار اعتماد الفرق: '+members.length+' من '+expected};
 if(letters.some(g=>members.filter(x=>x.group===g).length<=base))return {ready:false,reason:'عدد الفرق في إحدى المجموعات لا يكفي للتأهل الأساسي والمنافسة على المقاعد الإضافية'};
 const fixtures=plannedFixtures(tid);
 if(!fixtures.length)return {ready:false,reason:'جدول المجموعات غير مكتمل'};
 for(const f of fixtures){if(!db.matches.some(m=>m.tid===tid&&m.stage==='group'&&m.round===f.round&&((m.a===f.a&&m.b===f.b)||(m.a===f.b&&m.b===f.a))))return {ready:false,reason:'انتظار تسجيل كل نتائج المجموعات ('+fixtures.length+' مباراة)'}}
 const ordered=letters.map(g=>standings(tid,g)),remaining=start-base*count;
 const compare=(a,b)=>b.points-a.points||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf;
 // Choose the best eligible teams at the next unqualified position across groups.
 const extras=[];for(let rank=base;rank<Math.max(...ordered.map(x=>x.length))&&extras.length<remaining;rank++){
  const candidates=ordered.flatMap((rows,i)=>rows[rank]?[{...rows[rank],group:letters[i],position:rank+1}]:[]).sort((a,b)=>compare(a,b)||((t.tieDraw||[]).indexOf(a.id)-(t.tieDraw||[]).indexOf(b.id))||a.group.localeCompare(b.group));
  const take=Math.min(remaining-extras.length,candidates.length);
  if(take>0&&take<candidates.length&&compare(candidates[take-1],candidates[take])===0&&!t.tieDraw?.length)return {ready:false,reason:'تعادل مؤثر على آخر مقعد إضافي؛ يلزم حسمه بقرعة فاصلة إداريًا'};
  extras.push(...candidates.slice(0,take));
 }
 if(extras.length!==remaining)return {ready:false,reason:'عدد الفرق غير كافٍ لإكمال مقاعد التأهل'};
 const qualified=ordered.flatMap(rows=>rows.slice(0,base).map(x=>x.id)).concat(extras.map(x=>x.id));
 return {ready:true,qualified,extras,ordered,remaining,base,start,letters};
}
function fair24Bracket(tid){
 const info=fair24Rank(tid);if(!info.ready)return {rounds:[],reason:info.reason};
 const t=tour(tid),start=info.start,groupOf=id=>team(id)?.group;
 const ranked=info.qualified.map(id=>{const g=groupOf(id),r=info.ordered[info.letters.indexOf(g)].findIndex(x=>x.id===id);const x=info.ordered[info.letters.indexOf(g)][r];return {...x,group:g,position:r+1}});
 ranked.sort((a,b)=>a.position-b.position||b.points-a.points||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf||a.group.localeCompare(b.group));
 const high=ranked.slice(0,start/2).map(x=>x.id),low=ranked.slice(start/2).map(x=>x.id);
 const used=new Set(),pairs=[];
 function assign(i){if(i===high.length)return true;const options=low.filter(x=>!used.has(x)&&groupOf(x)!==groupOf(high[i]));for(const x of options){used.add(x);pairs.push([high[i],x]);if(assign(i+1))return true;pairs.pop();used.delete(x)}return false}
 if(!assign(0))return {rounds:[],reason:'تعذر تجنب مواجهات نفس المجموعة في أول دور؛ يلزم تعديل القرعة يدويًا'};
 let active=pairs.flat(),rounds=[];const totalRounds=Math.log2(start);
 for(let r=0;r<totalRounds;r++){
  const stage='GK-'+r,fixtures=[];
  if(r===0){for(const [a,b] of pairs)fixtures.push({a,b,stage,round:1})}
  else {for(let i=0;i<active.length;i+=2)fixtures.push({a:active[i],b:active[i+1],stage,round:r+1})}
  rounds.push(fixtures);const next=[];
  for(const f of fixtures){const m=resultFor(tid,stage,f.a,f.b);if(m)next.push(winnerFor(m))}
  if(next.length!==fixtures.length)break;active=next;
 }
 return {rounds,info};
}
function runTieDraw(tid){
 const t=tour(tid);if(!t||!adminSession||!isFair24(t))return;
 if(db.matches.some(m=>m.tid===tid&&m.stage.startsWith('GK-')))return alert('لا يمكن تغيير القرعة بعد بدء نتائج خروج المغلوب');
 const info=fair24Rank(tid);
 if(info.ready&&!confirm('إعادة إجراء القرعة الفاصلة قد تغيّر المتأهلين. هل تريد الاستمرار؟'))return;
 if(!info.ready&&!info.reason.includes('تعادل مؤثر'))return alert('لا توجد قرعة فاصلة مطلوبة حاليًا: '+info.reason);
 const ids=db.teams.filter(x=>x.tid===tid).map(x=>x.id);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 t.tieDraw=ids;t.tieDrawAt=new Date().toISOString();save();alert('تم إجراء القرعة الفاصلة وحفظها. راجع المتأهلين قبل النشر');
}
function fair24View(tid){const data=fair24Bracket(tid),info=fair24Rank(tid);let html='<h3>التأهل التلقائي: '+Number(tour(tid)?.baseQualifiers||2)+' من كل مجموعة + أفضل الفرق للمقاعد المتبقية</h3>';
 if(!info.ready)return html+`<div class="note">${esc(info.reason)}. لا تُنشأ القرعة قبل اكتمال الشروط.</div>`+(adminSession&&info.reason.includes('تعادل مؤثر')?`<button class="primary" onclick="runTieDraw('${tid}')">إجراء القرعة الفاصلة وحفظها</button>`:'');
 html+=`<p class="note">${info.base} من كل مجموعة (${info.base*info.letters.length} فريق) + ${info.remaining} من أفضل الفرق غير المتأهلة = ${info.start} فريق.</p>`;
 if(adminSession&&tour(tid)?.tieDrawAt)html+=`<p class="mini">تم حسم التعادل بقرعة إدارية محفوظة: ${esc(tour(tid).tieDrawAt)}</p>`; if(info.extras.length)html+='<h3>الفرق المتأهلة بالمقاعد الإضافية</h3><div class="tablewrap"><table><thead><tr><th>المجموعة</th><th>الفريق</th><th>المركز</th><th>النقاط</th><th>الفارق</th></tr></thead><tbody>'+info.extras.map(x=>`<tr><td>${esc(x.group)}</td><td>${esc(tname(x.id))}</td><td>${x.position}</td><td>${x.points}</td><td>${x.gf-x.ga}</td></tr>`).join('')+'</tbody></table></div>';
 for(const [i,round] of data.rounds.entries()){const n=info.start/Math.pow(2,i);html+=`<h3 style="margin-top:18px">${n===2?'النهائي':n===4?'نصف النهائي':n===8?'دور الـ8':'دور الـ16'}</h3>`;for(const f of round){const m=resultFor(tid,f.stage,f.a,f.b);html+=`<div class="match"><span>${esc(tname(f.a))}</span><span class="score">${m?m.sa+' : '+m.sb:'—'}</span><span>${esc(tname(f.b))}</span></div>`}}
 return html;
}
function groupConfigPanel(t){
 const count=Math.max(2,Math.min(16,Number(t.groupCount)||2)),start=Number(t.koStart)||8;
 const q=t.groupQualifiers||{};

')}<div class="field wide"><button class="primary" id="regSubmit">إرسال طلب الاشتراك للمراجعة</button><p id="regMsg" role="status" class="mini"></p></div></form></div><div class="card" style="margin-top:16px"><h3>متابعة حالة طلب سابق</h3><form onsubmit="checkRequest(event)" class="formgrid">${field('رقم الطلب','<input id="trackCode" required placeholder="الصق رقم الطلب هنا">')}<div class="field" style="align-self:end"><button>استعلام</button></div></form><p id="trackMsg" role="status"></p></div>${submittedCode?`<div class="note"><b>رقم طلبك:</b> <span dir="ltr">${esc(submittedCode)}</span><p>احتفظ به لمتابعة حالة الطلب.</p></div>`:''}`}
async function submitRegistration(e){e.preventDefault();if(!cloud)return alert('الاتصال بقاعدة البيانات غير متاح');const t=tour($('regTour').value),p1=$('regP1').value.trim(),p2=$('regP2').value.trim(),phone=$('regPhone').value.trim(),file=$('regReceipt').files?.[0],reference=$('regReference').value.trim(),msg=$('regMsg'),button=$('regSubmit');if(!t||t.status==='منتهية')return alert('البطولة غير متاحة');if(!Number.isInteger(Number(t.fee))||Number(t.fee)<=0)return alert('لم يتم تحديد رسوم اشتراك صحيحة لهذه البطولة. تواصل مع الإدارة');if(normalizePlayerName(p1)===normalizePlayerName(p2))return alert('لا يمكن تسجيل نفس الاسم مرتين في الفريق');if(!/^01[0125][0-9]{8}$/.test(phone))return alert('اكتب رقم موبايل مصري صحيح');const receiptTypes={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',dng:'image/x-adobe-dng'};const ext=file?.name.split('.').pop()?.toLowerCase();const contentType=receiptTypes[ext];if(!file||!contentType||!file.size||file.size>10*1024*1024)return alert('ارفع صورة JPG أو PNG أو WebP أو HEIC أو HEIF أو DNG بحد أقصى 10 ميجابايت');const compatibleMimes={jpg:['image/jpeg','image/jpg'],jpeg:['image/jpeg','image/jpg'],png:['image/png'],webp:['image/webp'],heic:['image/heic','image/heic-sequence','application/octet-stream'],heif:['image/heif','image/heif-sequence','application/octet-stream'],dng:['image/x-adobe-dng','image/dng','image/tiff','application/octet-stream']};if(file.type&&!compatibleMimes[ext].includes(file.type.toLowerCase()))return alert('نوع الملف لا يطابق امتداده؛ اختر صورة أصلية سليمة');button.disabled=true;msg.textContent='جار رفع الإيصال وتسجيل الطلب...';const path=crypto.randomUUID()+'.'+ext;try{const upload=await cloud.storage.from('st-payment-receipts').upload(path,file,{contentType,upsert:false});if(upload.error)throw upload.error;const {data,error}=await cloud.rpc('st_submit_registration',{p_tournament_id:t.id,p_player_one:p1,p_player_two:p2,p_phone:phone,p_receipt_path:path,p_reference:reference||null});if(error)throw error;submittedCode=data;msg.textContent='تم إرسال الطلب. احتفظ برقم الطلب الظاهر أدناه.';render();}catch(err){msg.textContent='تعذر إرسال الطلب: '+err.message;}finally{button.disabled=false;}}
async function checkRequest(e){e.preventDefault();const code=$('trackCode').value.trim(),msg=$('trackMsg');msg.textContent='جار الاستعلام...';const {data,error}=await cloud.rpc('st_track_registration',{p_code:code});msg.textContent=error?'حدث خطأ أثناء الاستعلام':!data?'رقم الطلب غير صحيح':data==='pending'?'طلبك قيد مراجعة الدفع':data==='approved'?'تم اعتماد الدفع وتسجيل الفريق رسميًا':'تم رفض الطلب، تواصل مع الإدارة';}
async function loadPaymentRequests(){if(!adminSession||!cloud)return;requestLoading=true;const {data,error}=await cloud.from('st_registrations').select('id,code,tournament_id,tournament_name,player_one,player_two,phone,fee,receipt_path,reference,status,created_at').order('created_at',{ascending:false});requestLoading=false;if(error){console.error(error);return;}paymentRequests=data||[];if(page==='admin'&&adminTab==='payments')render()}
function paymentsAdmin(){const pending=paymentRequests.filter(r=>r.status==='pending').length;return `<div class="toolbar"><h2>طلبات الاشتراك والمدفوعات (${pending} معلّق)</h2><button onclick="loadPaymentRequests()">تحديث الطلبات</button></div><p class="note">راجع وصول المبلغ فعليًا في حساب InstaPay قبل الموافقة. الإيصال وحده لا يثبت الدفع. الموافقة تضيف اللاعبين والفريق إلى البطولة.</p>${requestLoading?'<p>جار تحميل الطلبات...</p>':''}${paymentRequests.length?paymentRequests.map(r=>`<div class="card" style="margin-bottom:12px"><div class="row"><b>${esc(r.player_one)} / ${esc(r.player_two)}</b><span class="pill">${r.status==='pending'?'بانتظار المراجعة':r.status==='approved'?'مقبول':'مرفوض'}</span></div><p>${esc(r.tournament_name)} · <b>${Number(r.fee)} ج.م</b> · ${esc(r.phone)}</p><p class="mini">رقم الطلب: <span dir="ltr">${esc(r.code)}</span> · ${esc(new Date(r.created_at).toLocaleString('ar-EG'))}</p><p class="mini">المرجع: ${esc(r.reference||'غير مذكور')}</p><div class="row"><button onclick="viewReceipt('${r.id}')">عرض الإيصال (خاص بالإدارة)</button>${r.status==='pending'?`<button class="primary" onclick="decideRegistration('${r.id}','approve')">تأكيد الدفع واعتماد الفريق</button><button class="danger" onclick="decideRegistration('${r.id}','reject')">رفض الطلب</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد طلبات بعد.</div>'}`}
async function viewReceipt(id){const r=paymentRequests.find(x=>x.id===id);if(!r)return;const {data,error}=await cloud.storage.from('st-payment-receipts').createSignedUrl(r.receipt_path,90);if(error)return alert('تعذر فتح الإيصال: '+error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function decideRegistration(id,action){const r=paymentRequests.find(x=>x.id===id);if(!r||r.status!=='pending')return;if(!confirm(action==='approve'?`هل تأكدت من وصول ${r.fee} جنيه لحساب InstaPay؟ سيتم اعتماد الفريق رسميًا.`:'رفض الطلب؟'))return;const {error}=await cloud.rpc(action==='approve'?'st_approve_registration':'st_reject_registration',{p_registration_id:id});if(error)return alert('تعذر تنفيذ العملية: '+error.message);await loadCloud();await loadPaymentRequests();alert(action==='approve'?'تم اعتماد الدفع والفريق بنجاح':'تم رفض الطلب')}
function editTeamGroup(id){const t=team(id);if(!t)return;const g=prompt('اكتب المجموعة للفريق (مثال A أو B):',t.group||'');if(g===null)return;const val=g.trim().toUpperCase();if(!/^[A-Z0-9]{1,12}$/.test(val))return alert('اكتب مجموعة صحيحة مثل A أو B');t.group=val;save()}
function editTourFee(id){const t=tour(id);if(!t)return;const n=prompt('رسوم اشتراك الفريق بالكامل (جنيه):',String(t.fee??0));if(n===null)return;const v=Number(n);if(!Number.isSafeInteger(v)||v<0||v>1000000)return alert('أدخل مبلغًا صحيحًا');t.fee=v;save()}

render();initCloud();if(page==='admin'&&adminTab==='results')syncTeams();

function bulkImportTeams(e){e.preventDefault();if(!adminSession)return alert('سجل دخول الإدارة أولًا');const tid=$('bulkTour').value,lines=$('bulkLines').value.trim().split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!tid||!lines.length)return;const errors=[],rows=[],existing=new Set(db.teams.filter(t=>t.tid===tid).map(t=>t.players.slice().sort().join('|')));const playerByName=new Map(db.players.map(p=>[normalizePlayerName(p.name),p.id]));for(let i=0;i<lines.length;i++){const cols=lines[i].split(/[,،;\t]/).map(x=>x.trim());if(cols.length!==3||!cols[0]||!cols[1]||!/^[AB]$/i.test(cols[2])){errors.push('سطر '+(i+1)+': استخدم الاسم، الاسم، A أو B');continue}const names=cols.slice(0,2),keys=names.map(x=>normalizePlayerName(x));if(keys[0]===keys[1]){errors.push('سطر '+(i+1)+': نفس اللاعب مكرر');continue}const ids=keys.map(k=>playerByName.get(k)||'new:'+k),key=ids.slice().sort().join('|');if(existing.has(key)){errors.push('سطر '+(i+1)+': الفريق موجود');continue}existing.add(key);rows.push({names,keys,group:cols[2].toUpperCase()})}if(errors.length)return alert('لم يتم استيراد أي بيانات:\n'+errors.join('\n'));if(!confirm('استيراد '+rows.length+' فريق قديم؟ هذه الطريقة لا تتحقق من دفع InstaPay.'))return;for(const row of rows){const ids=row.keys.map((k,i)=>{let id=playerByName.get(k);if(!id){id=uid();db.players.push({id,name:row.names[i]});playerByName.set(k,id)}return id});db.teams.push({id:uid(),tid,group:row.group,players:ids})}save();alert('تم استيراد '+rows.length+' فريق')}
</script></body></html>
